        var mark = (!r.mine && r.id && typeof deckMark === "function") ? deckMark(r.id) : "";
        return '<tr' + (r.mine ? ' class="cons-mine"' : "") + '><td><span class="table-name">' +
          mark + esc(r.name) + "</span>" +
          (r.unknown ? ' <span class="badge">' + r.unknown + " not in the card database</span>" : "") +
          (r.pending ? ' <span class="badge warn">' + r.pending + " unread — measure again</span>" : "") +
          "</td>" +
          (r.mine
            ? '<td class="num">—</td>'
            : (typeof fieldRankCell === "function" ? fieldRankCell(r.id) : '<td class="num">—</td>')) +
          "<td>" + meter(r.L, bandL(r.L)) + "</td><td>" +
          '<span class="cons-num ' + bandMull(r.mull) + '">' +
          (r.mull === null ? "—" : pct(r.mull, 0)) + "</span></td><td>" + r.counts.basic +
          "</td><td>" + r.counts.search + "</td><td>" + r.counts.draw + "</td></tr>";
      }).join("") +
      "</tbody></table></div>" +
      (viewingOnly()
        ? '<p class="hint">Measured on the computer holding the database; this view shows the result.</p>'
        : '<p class="cons-identify"><button class="button" id="cons-field"' + (field.busy ? " disabled" : "") +
          '>Measure again</button><span class="hint" id="cons-field-msg">' + esc(field.note) + "</span></p>") +
      '<p class="hint">“Works by turn 2” is the same L as above: a Basic, two engine cards and an ' +
      "energy in hand by the end of your second turn, counting only hands worth keeping. Two things " +
      "to hold lightly: a list is one player's choices on one day rather than the archetype itself, " +
      "and a card counts as engine only if the card database carries its text, so a brand-new " +
      "supporter can be missed until the database catches up.</p></div>";
  }

  /* One archetype: its published list from Limitless, then the card types.
     Anything that goes wrong is caught here and turned into a row, so one
     archetype with no list - or one slow minute at the card database -
     cannot stop the other fourteen. */
  async function measureOne(e) {
    try {
      var r = await api("/api/field", { id: e.id });
      var c = r.counts;
      return {
        id: e.id,
        name: r.name || e.name,
        L: c.total === DECK ? listConsistency(c.basic, c.search + c.draw, c.energy) : null,
        mull: c.basic ? mulligan(c.basic).p : null,
        counts: c,
        line: slowestLine({ list: r.cards || [], cardClass: r.types || {} }),
        unknown: (r.unknown || []).length,
        pending: (r.pending || []).length,
        source: r.source,
      };
    } catch (err) {
      return { id: e.id, name: e.name, L: null, mull: null,
               counts: { basic: 0, search: 0, draw: 0, energy: 0, total: 0 },
               unknown: 0, pending: 0, failed: true,
               offline: (err && err.kind) === "offline",
               source: (err && err.message) || "no list found" };
    }
  }

  async function measureField() {
    /* Same rule as lookUp: a measurement is kept on disk, so it is work only
       the computer holding the database can do. */
    if (viewingOnly()) return;
    var top = topArchetypes(FIELD_SIZE);
    var msg = function (t) {
      var el = document.getElementById("cons-field-msg");
      if (el) el.textContent = t;
    };
    field.busy = true;
    field.rows = [];
    for (var i = 0; i < top.length; i++) {
      msg("Measuring " + (i + 1) + " of " + top.length + " — " + top[i].name + "…");
      field.rows.push(await measureOne(top[i]));
    }

    /* A deck that came back short - no answer at all, or cards the card
       database never named - is asked about once more. The second try is
       cheap: every card already read is on this computer, so it only has to
       catch what the first pass missed. */
    var short = [];
    field.rows.forEach(function (r, at) {
      if (r.failed || r.pending) short.push(at);
    });
    for (var j = 0; j < short.length; j++) {
      var at = short[j];
      msg("Trying " + (j + 1) + " of " + short.length + " again — " + field.rows[at].name + "…");
      var redo = await measureOne(top[at]);
      if (!redo.failed && (redo.L !== null || !field.rows[at].L)) field.rows[at] = redo;
    }

    field.busy = false;
    field.done = true;
    var measured = field.rows.filter(function (r) { return r.L !== null; }).length;
    var offline = field.rows.filter(function (r) { return r.offline; }).length;
    var noList = field.rows.filter(function (r) { return r.failed && !r.offline; }).length;
    if (offline && !measured) {
      /* Every deck failed before Limitless was even reached. Saying "no
         published list" here would blame the data for what is a problem on
         this computer. */
      field.note = "Could not reach Limitless from this computer, so the field could not " +
        "be measured. The decks and their places above come from the report already stored " +
        "here, which needs no connection. First thing to check: whether this computer can " +
        "verify secure connections at all — on Windows, run Diagnose and read the HTTPS line." +
        (field.rows[0] && field.rows[0].source ? " (" + field.rows[0].source + ")" : "");
      render();
      return;
    }
    var short2 = field.rows.filter(function (r) { return !r.failed && r.pending; }).length;
    field.note = "Measured " + measured + " of " + top.length +
      " decks. Lists come from Limitless and are kept on this computer." +
      (noList ? " " + plural(noList, "deck") + " had no published list to read." : "") +
      (short2 ? " " + plural(short2, "deck") + " still missing a card or two the " +
        "card database would not name — press Measure again in a moment to finish." : "");
    render();
  }

  // ---- the page ----------------------------------------------------------
  function deckOf() {
    var decks = state.config.decks.filter(function (d) { return !d.archived; });
    if (!decks.length) return null;
    var want = selected || state.config.active;
    return decks.filter(function (d) { return d.id === want; })[0] || decks[0];
  }

  function losses(n) { return n + (n === 1 ? " loss" : " losses"); }

  function cell(value, label) {
    return '<div class="total"><strong>' + esc(String(value)) + "</strong><span>" +
      esc(label) + "</span></div>";
  }

  function pct(x, dp) { return (100 * x).toFixed(dp === undefined ? 1 : dp) + "%"; }

  function bar(label, v) {
    if (v === null || v === undefined)
      return '<div class="cons-bar"><span>' + label + "</span><b>not enough yet</b></div>";
    return '<div class="cons-bar"><span>' + label + '</span><i style="width:' +
      (100 * v).toFixed(0) + '%"></i><b>' + v.toFixed(2) + "</b></div>";
  }



  function check(label, value, note, v) {
    return '<div class="cons-check ' + tone(v) + '"><span class="cons-check-label">' +
      esc(label) + '</span><b>' + esc(value) + "</b><span class=\"cons-check-note\">" +
      esc(note) + "</span></div>";
  }

  /* ---- what the 60 cards actually are ---------------------------------
     The consistency maths sees four buckets: Basics, engine, energy and
     "everything else". That is enough to work out an opening hand and far
     too little to advise on a deck, because "everything else" is where the
     evolution lines, the gust, the tools and the single ACE SPEC live. The
     card database already tells us what each card is; these functions keep
     it and use it. */

  /* Ranges a deck is normally built to. Sources are in the manual: the
     commonly used skeleton is about 20 Pokémon, 30 Trainers and 10 energy,
     with 4-9 draw Supporters, 2-4 gust effects and 8-10 cards that search
     out a Pokemon. Top lists move about three cards either way, so these
     are deliberately wider than the textbook figure. */
  var SKELETON = {
    pokemon: { lo: 14, hi: 24, label: "Pokémon", usual: "about 20" },
    trainer: { lo: 24, hi: 36, label: "Trainer cards", usual: "about 30" },
    energy: { lo: 5, hi: 15, label: "energy", usual: "about 10" },
    drawSup: { lo: 4, hi: 9, label: "draw Supporters", usual: "4 to 9" },
    gust: { lo: 2, hi: 4, label: "gust effects", usual: "2 to 4" },
    pokeSearch: { lo: 6, hi: 12, label: "cards that search out a Pokémon", usual: "8 to 10" },
  };

  function roleOf(d, c) {
    var m = (d.cardClass || {})[c.name];
    return m && m.super ? m : null;        // only an identified card has a role
  }

  /* Every count the deck checks need, in one pass. */
  function deckRoles(d) {
    var r = {
      total: 0, unknown: 0, pokemon: 0, trainer: 0, energy: 0,
      basicEnergy: 0, specialEnergy: 0, basic: 0, stage1: 0, stage2: 0,
      supporter: 0, drawSup: 0, gust: 0, item: 0, tool: 0, stadium: 0,
      pokeSearch: 0, candy: 0, ace: 0, aceNames: [], byName: {}, cards: [],
    };
    (d.list || []).forEach(function (c) {
      var n = c.n, m = roleOf(d, c), marks = marksOf(d, c);
      r.total += n;
      r.byName[c.name] = (r.byName[c.name] || 0) + n;
      if (!m) {
        // not identified: counted only where a hand mark can stand in
        r.unknown += n;
        if (marks.energy) { r.energy += n; r.basicEnergy += n; }
        return;
      }
      r.cards.push({ card: c, role: m });
      if (m.ace) { r.ace += n; if (r.aceNames.indexOf(c.name) < 0) r.aceNames.push(c.name); }
      if (m.super === "pokemon") {
        r.pokemon += n;
        if (m.stage === "Basic") r.basic += n;
        else if (m.stage === "Stage 1") r.stage1 += n;
        else if (m.stage === "Stage 2") r.stage2 += n;
      } else if (m.super === "energy") {
        r.energy += n;
        if (m.special) r.specialEnergy += n; else r.basicEnergy += n;
      } else if (m.super === "trainer") {
        r.trainer += n;
        if (m.kind === "Supporter") {
          r.supporter += n;
          if (m.gust) r.gust += n;
          else if (m.draw) r.drawSup += n;
        } else if (m.kind === "Stadium") r.stadium += n;
        else if (m.kind === "Tool") r.tool += n;
        else r.item += n;
        if (m.gust && m.kind !== "Supporter") r.gust += n;
        if (m.pokeSearch) r.pokeSearch += n;
        if (m.candy) r.candy += n;
      }
    });
    return r;
  }

  /* ---- the rules of the game, not opinions ---------------------------- */
  function legality(d, r) {
    var out = [];
    if (r.total !== DECK)
      out.push({
        title: "This list is not 60 cards",
        body: "It holds " + r.total + ". A tournament deck is exactly 60 — " +
          (r.total < DECK ? "add " + (DECK - r.total) : "cut " + (r.total - DECK)) + ".",
      });
    var over = Object.keys(r.byName).filter(function (name) {
      if (r.byName[name] <= 4) return false;
      var card = (d.list || []).filter(function (c) { return c.name === name; })[0];
      var m = card ? roleOf(d, card) : null;
      // basic energy is the one card you may play any number of
      return !(m ? m.super === "energy" && !m.special : /\bEnergy$/i.test(name));
    });
    if (over.length)
      out.push({
        title: "More than four copies of a card",
        body: over.map(function (n) { return n + " ×" + r.byName[n]; }).join(", ") +
          ". Only basic energy may go past four copies of one name.",
      });
    if (r.ace > 1)
      out.push({
        title: "More than one ACE SPEC",
        body: "This list holds " + r.ace + ": " + r.aceNames.join(", ") +
          ". A deck may contain exactly one ACE SPEC card in total — not one of each. " +
          "All but one have to go.",
      });
    if (!r.unknown && !r.basic)
      out.push({
        title: "No Basic Pokémon",
        body: "A deck with no Basic cannot start a game at all.",
      });
    return out;
  }

  /* ---- the shape of the deck ------------------------------------------ */
  function band(key, have) {
    var s = SKELETON[key];
    if (!s) return null;
    if (have >= s.lo && have <= s.hi) return null;
    return {
      key: key,
      have: have,
      low: have < s.lo,
      text: have + " " + s.label + (have < s.lo ? " — decks usually play " : " — usually ") +
        s.usual + ".",
    };
  }

  function structure(r) {
    if (r.unknown) return [];
    var out = [];
    ["pokemon", "trainer", "energy", "drawSup", "gust", "pokeSearch"].forEach(function (k) {
      var b = band(k, r[k]);
      if (b) out.push(b);
    });
    return out;
  }

  /* ---- evolution lines, and whether they arrive in time ---------------- */
  function evolutionLines(d, r) {
    var byName = {};
    r.cards.forEach(function (x) {
      byName[x.card.name] = { name: x.card.name, n: x.card.n, role: x.role };
    });
    var lines = [];
    Object.keys(byName).forEach(function (name) {
      var card = byName[name];
      if (card.role.stage !== "Basic" || card.role.super !== "pokemon") return;
      var next = Object.keys(byName).filter(function (o) {
        return byName[o].role.from === name;
      });
      next.forEach(function (midName) {
        var mid = byName[midName];
        var top = Object.keys(byName).filter(function (o) {
          return byName[o].role.from === midName;
        });
        if (top.length) {
          top.forEach(function (topName) {
            lines.push({ basic: card, mid: mid, top: byName[topName] });
          });
        } else {
          lines.push({ basic: card, mid: mid, top: null });
        }
      });
    });
    return lines;
  }

  /* Is the line standing on turn two?
     The hypergeometric answer to that question is wrong, and wrong in a way
     that matters: it asks whether the pieces are among the first nine cards,
     when a real game plays a draw Supporter on turn one and sees seven more.
     So this is simulated instead, as the turns are actually taken:

       - seven cards, redrawn while the hand holds no Basic at all;
       - the player going second draws one;
       - a draw Supporter is played only if the rules allow it that turn, and
         five more cards are seen (Research gives seven, Iono around five,
         Judge four - five is the cautious middle);
       - the Basic has to reach the table on turn one, or there is nothing to
         evolve on turn two;
       - turn two: one more card, and a Supporter if one is still in hand.

     Two rules the first version of this ignored, and both flattered the
     deck: the player going first may not play a Supporter on that turn, and
     a Pokemon cannot evolve on the turn it comes into play. Together they
     were worth four to five points. A Stage 2 needs the Basic, a Rare Candy
     and the Stage 2 itself, because the route through the Stage 1 takes a
     turn longer. Cards that search a Pokemon out count as copies of the
     Basic, and are spent on one piece only, so the figure stays an estimate
     of resources rather than a hope. Both turn orders are averaged, the
     generator is seeded from the list so the figure does not drift between
     renders, and four thousand games take about a tenth of a second. */
  var RUNS = 4000, SUPPORTER_CARDS = 5;
  /* One number per card, so a hand can be counted rather than flagged: a
     card that could fetch either piece of the line is spent on one of them,
     never on both. */
  var T_PLAIN = 0, T_BASIC = 1, T_LINE_BASIC = 2, T_FIND_BASIC = 3, T_FIND_ANY = 4,
      T_CANDY = 5, T_FIND_ITEM = 6, T_EVO = 7, T_DRAW = 8;

  function lineTokens(r, line) {
    var evoName = line.top ? line.top.name : line.mid.name;
    var stage2 = !!line.top;
    var deck = [];
    r.cards.forEach(function (x) {
      var m = x.role, name = x.card.name, token = T_PLAIN;
      if (name === line.basic.name) token = T_LINE_BASIC;
      else if (name === evoName) token = T_EVO;
      else if (stage2 && m.candy) token = T_CANDY;
      else if (m.findsAny) token = T_FIND_ANY;
      else if (m.findsBasic || (m.pokeSearch && !m.findsItem)) token = T_FIND_BASIC;
      else if (stage2 && m.findsItem) token = T_FIND_ITEM;
      else if (m.super === "pokemon" && m.stage === "Basic") token = T_BASIC;
      else if (m.kind === "Supporter" && m.draw) token = T_DRAW;
      for (var i = 0; i < x.card.n; i++) deck.push(token);
    });
    while (deck.length < DECK) deck.push(T_PLAIN);
    return deck;
  }

  /* A small, repeatable generator. The figure a deck gets must not change
     between two renders of the same page, which Math.random cannot promise. */
  function seeded(seed) {
    var a = seed >>> 0;
    return function () {
      a += 0x6D2B79F5;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function deckSeed(deck, stage2) {
    var h = stage2 ? 2166136261 : 16777619;
    for (var i = 0; i < deck.length; i++) h = Math.imul(h ^ (deck[i] + 1), 16777619);
    return h >>> 0;
  }

  /* One game, played to the end of turn two, under the rules that matter here:
       - the player going first may not play a Supporter on that turn;
       - a Pokemon cannot evolve on the turn it reaches the table, so the
         Basic of the line has to be down by the end of turn one;
       - Rare Candy is the only way a Stage 2 arrives on turn two.
     Earlier this asked only whether every piece was in hand by the end of
     turn two, which let the player going first draw five cards they were not
     allowed to, and let a Basic drawn on turn two evolve the same turn. Both
     flattered the deck, together by four to five points. */
  function playOut(deck, stage2, second, rnd) {
    var n = deck.length, order = deck.slice(), seen = 0;
    var hand = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    var take = function (k) {
      for (var c = 0; c < k && seen < n; c++) {
        var j = seen + Math.floor(rnd() * (n - seen));
        var t = order[j]; order[j] = order[seen]; order[seen] = t;
        hand[order[seen]]++;
        seen++;
      }
    };
    var anyBasic = function () { return hand[T_BASIC] + hand[T_LINE_BASIC]; };
    for (var i = 0; i < 12; i++) {
      seen = 0; order = deck.slice();
      hand = [0, 0, 0, 0, 0, 0, 0, 0, 0];
      take(7);
      if (anyBasic()) break;          // a hand with no Basic is redrawn
    }
    if (second) take(1);

    /* Turn one. Only the player going second may play a draw Supporter. */
    var supportersPlayed = 0;
    if (second && hand[T_DRAW]) { take(SUPPORTER_CARDS); supportersPlayed = 1; }

    /* The Basic has to be on the table now, or there is nothing to evolve
       next turn. A card that searches out anything is spent doing it. */
    var spentFlexible = 0;
    var basicDown = hand[T_LINE_BASIC] > 0 || hand[T_FIND_BASIC] > 0;
    if (!basicDown && hand[T_FIND_ANY] > 0) { basicDown = true; spentFlexible = 1; }
    if (!basicDown) return false;

    /* Turn two. */
    take(1);
    if (hand[T_DRAW] > supportersPlayed) take(SUPPORTER_CARDS);

    var flexible = hand[T_FIND_ANY] - spentFlexible;
    var evoOk = hand[T_EVO] > 0 || flexible > 0;
    /* A card that searches out a Pokemon cannot fetch a Rare Candy; only one
       that searches out an Item can. */
    var candyOk = !stage2 || hand[T_CANDY] > 0 || hand[T_FIND_ITEM] > 0;
    return evoOk && candyOk;
  }

  function lineOnTime(r, line) {
    if (r.total !== DECK) return null;
    var stage2 = !!line.top;
    var evo = stage2 ? line.top : line.mid;
    if (stage2 && !r.candy) return { p: 0, noCandy: true, evo: evo, stage2: true };
    var deck = lineTokens(r, line);
    var rnd = seeded(deckSeed(deck, stage2));
    var hits = 0;
    for (var i = 0; i < RUNS; i++) if (playOut(deck, stage2, i % 2 === 1, rnd)) hits++;
    return { p: hits / RUNS, evo: evo, stage2: stage2, outsBasic: line.basic.n + r.pokeSearch };
  }

  /* Everything the tournament brief needs about a deck, worked out by the
     same functions this page uses - so the printed sheet and the screen can
     never quietly disagree about a number. */
  /* What two lists hold differently, card by card. Lives here rather than
     with the screen that draws it, so the release gate can check it. */
  window.listDiff = function (a, b) {
    var count = function (list) {
      var m = new Map();
      (list || []).forEach(function (c) { m.set(c.name, (m.get(c.name) || 0) + c.n); });
      return m;
    };
    var x = count(a), y = count(b);
    var names = [];
    x.forEach(function (_v, k) { names.push(k); });
    y.forEach(function (_v, k) { if (names.indexOf(k) < 0) names.push(k); });
    names.sort();
    var out = { in: [], out: [], same: 0, shared: 0 };
    names.forEach(function (n) {
      var from = x.get(n) || 0, to = y.get(n) || 0;
      out.shared += Math.min(from, to);
      if (from === to) out.same += from;
      else if (to > from) out.in.push({ name: n, from: from, to: to, by: to - from });
      else out.out.push({ name: n, from: from, to: to, by: from - to });
    });
    var rank = function (p, q) { return q.by - p.by || p.name.localeCompare(q.name); };
    out.in.sort(rank);
    out.out.sort(rank);
    return out;
  };

  /* Everything a list says about itself, worked out from the sixty cards and
     nothing else. No rounds, no opponents, no sample size - which is what
     makes it the honest half of a comparison between two versions. The deck
     is only there for its card marks; the list is the subject. */
  window.listMeasures = function (d, list) {
    var fake = { id: d.id, name: d.name, list: list || [], cardClass: d.cardClass || {} };
    var c = classesOf(fake);
    var r = deckRoles(fake);
    var out = {
      total: c.total,
      basic: c.basic, search: c.search, draw: c.draw, energy: c.energy,
      L: c.total === DECK ? listConsistency(c.basic, c.engine, c.energy) : null,
      mull: c.basic ? mulligan(c.basic).p : null,
      roles: r,
      legality: legality(fake, r),
      unknown: r.unknown,
      lines: [],
    };
    if (!r.unknown) {
      evolutionLines(fake, r).forEach(function (line) {
        var t = lineOnTime(r, line);
        if (t) out.lines.push({ line: line, on: t });
      });
    }
    return out;
  };

  window.consistencySummary = function (d) {
    d = d || deckOf();
    if (!d) return null;
    var c = classesOf(d);
    var L = c.total === DECK ? listConsistency(c.basic, c.engine, c.energy) : null;
    var ms = realMatches(d.id);
    var games = gamesOf(ms);
    var s = L !== null && games.length ? score(games, L) : null;
    return {
      deck: d,
      counts: c,
      complete: c.total === DECK,
      L: L,
      mulligan: c.total === DECK && c.basic ? mulligan(c.basic) : null,
      full: c.total === DECK ? completeStart(c.basic, c.search, c.draw, c.energy) : null,
      games: games.length,
      score: s,
      interval: s ? interval(ms, L) : null,
      verdict: s ? verdict(s, games.length) : null,
      advice: L !== null ? advice(c, L, s, games, games.length, d) : [],
      roles: deckRoles(d),
      legality: legality(d, deckRoles(d)),
      lines: (function () {
        var rr = deckRoles(d);
        if (rr.unknown) return [];
        return evolutionLines(d, rr).map(function (line) {
          return { line: line, on: lineOnTime(rr, line) };
        }).filter(function (x) { return x.on; });
      })(),
      inTen: inTen,
    };
  };

  window.renderConsistency = function () {
    var decks = state.config.decks.filter(function (d) { return !d.archived; });

      .sort(function (a, b) { return b.n - a.n; });
    var named = all.filter(function (r) { return r.key; });
    return named.length ? named : all;
  }

  /* Cut at the end of a sentence, not in the middle of a word: a printed
     page cannot be expanded to see the rest. */
  function trim(text, max) {
    text = String(text || "").replace(/\s+/g, " ").trim();
    if (text.length <= max) return text;
    var cut = text.slice(0, max);
    var stop = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("; "));
    if (stop > max * 0.5) return cut.slice(0, stop + 1);
    return cut.slice(0, cut.lastIndexOf(" ")).trimEnd() + "…";
  }

  /* The list, grouped the way a player reads it rather than the way it is
     stored. Counts are kept so the three headings can show them. */
  function listGroups(d) {
    var cards = d.list || [];
    var known = cards.some(function (c) { return c.group; });
    var groups = { pokemon: [], trainer: [], energy: [], other: [] };
    cards.forEach(function (c) {
      if (known && c.group) return groups[c.group].push(c);
      // A list typed or pasted in carries no card types: the export format
      // does not say. Energy can be read off the name; guessing which of the
      // rest are Pokemon would put Dreepy under Trainer, so they stay in one
      // list rather than under a wrong heading.
      if (/\bEnergy$/i.test(c.name || "")) groups.energy.push(c);
      else (known ? groups.trainer : groups.other).push(c);
    });
    return groups;
  }

  function groupBlock(title, cards) {
    if (!cards.length) return "";
    var n = cards.reduce(function (s, c) { return s + c.n; }, 0);
    return '<div class="brief-group"><h4>' + esc(title) + " <span>" + n + "</span></h4><ul>" +
      cards.map(function (c) {
        return "<li><b>" + c.n + "</b> " + esc(c.name) + "</li>";
      }).join("") + "</ul></div>";
  }

  function figure(value, label, note) {
    return '<div class="brief-figure"><b>' + esc(value) + "</b><span>" + esc(label) + "</span>" +
      (note ? "<em>" + esc(note) + "</em>" : "") + "</div>";
  }

  /* ---- page one: the deck ------------------------------------------- */
  function deckPage(d, sum, when) {
    var c = sum ? sum.counts : null;
    var version = (d.versions || []).filter(function (v) { return v.id === d.currentVersion; })[0];
    var figures = "", missing = "";
    if (sum && sum.L === null) {
      missing = '<p class="brief-warn">' + esc(
        !sum.complete
          ? "This list has " + (c ? c.total : 0) + " cards, so the consistency figures are " +
            "left out — they need exactly 60."
          : "The cards in this list have not been identified yet, so the consistency figures " +
            "are missing. Open Consistency once: the app reads the card types by itself and " +
            "they appear here too.") + "</p>";
    }
    if (sum && sum.L !== null) {
      var openings = sum.score
        ? sum.inTen(sum.score.c1) + " in 10"
        : sum.inTen(sum.L) + " in 10";
      figures =
        figure(openings, "openings that work",
          sum.score ? "from " + sum.games + " recorded games" : "from the card maths alone") +
        figure(sum.mulligan ? pct(sum.mulligan.p, 0) : "—", "mulligan rate",
          c.basic + " Basics in the list") +
        figure(c.search + " / " + c.draw, "finds / draws", c.engine + " engine cards in all") +
        figure(sum.score ? sum.score.index.toFixed(0) : "—", "consistency, out of 100",
          sum.verdict ? sum.verdict.word : "needs recorded games");
    }

    /* Two, not three: the sheet has to stay at two pages, and the third tip
       is almost always the one about needing more games. */
    var tips = (sum && sum.advice ? sum.advice : []).slice(0, 2).map(function (t) {
      return "<li><b>" + esc(t.title) + "</b> — " + esc(trim(t.body, 260)) + "</li>";
    }).join("");

    var groups = listGroups(d);
    var broken = (sum && sum.legality) || [];
    var unread = sum && sum.roles ? sum.roles.unknown : 0;
    var stale = !unread ? "" :
      '<div class="brief-warn"><b>' + unread + " of the cards have not been read since the " +
      "app was updated.</b> Until they are, this sheet cannot show the rules check or the " +
      "evolution lines. Open Consistency once — the reading has already been started in the " +
      "background, so it may well be done by the time you get there.</div>";
    var rules = !broken.length ? "" :
      '<div class="brief-warn"><b>This list breaks a rule of the game.</b> ' +
      broken.map(function (b) { return esc(b.title) + " — " + esc(b.body); }).join(" ") + "</div>";
    var lines = ((sum && sum.lines) || []).map(function (x) {
      var l = x.line, t = x.on;
      return "<li><b>" + esc(l.basic.name) + " → " + esc(l.mid.name) +
        (l.top ? " → " + esc(l.top.name) : "") + "</b> — " +
        (t.noCandy ? "turn 3 at the earliest, no Rare Candy in the list"
                   : "standing by turn 2 in " + pct(t.p, 0) + " of games") + "</li>";
    }).join("");
    return '<section class="brief-page">' +
      '<header class="brief-head"><div><h1>' + esc(d.name) + "</h1>" +
      '<p class="brief-sub">' + esc(nameOf(d.archetype) || d.archetype || "no archetype") +
      (version ? " · " + esc(version.label) : "") +
      " · " + esc(plural(listCount(d), "card")) + " · brief made " + esc(when) +
      (typeof appBuild === "string" && appBuild ? " · app " + esc(appBuild) : "") + "</p></div>" +
      '<div class="brief-event"><span>Event</span><span>Date</span></div></header>' +
      stale + rules + (figures ? '<div class="brief-figures">' + figures + "</div>" : missing) +
      '<div class="brief-two">' +
      '<div class="brief-list"><h3>The 60 cards</h3>' +
      groupBlock("Pokémon", groups.pokemon) +
      groupBlock("Trainer", groups.trainer) +
      groupBlock("Cards", groups.other) +
      groupBlock("Energy", groups.energy) +
      "</div>" +
      '<div class="brief-side">' +
      (lines ? '<h3>Lines on time</h3><ul class="brief-tips">' + lines + "</ul>" : "") +
      (tips ? "<h3>Worth doing to the list</h3><ul class=\"brief-tips\">" + tips + "</ul>" : "") +
      "<h3>Before the first round</h3><ul class=\"brief-tips\">" +
      "<li><b>One copy is seen in about 15% of games by turn 2</b>; even four copies only reach " +
      "half. Nothing the opening depends on should stand on one card — except the ACE SPEC, " +
      "where one is the most the rules allow.</li>" +

      "<li><b>Write the round down before the next one starts.</b> Page two is made of what " +
      "was written after earlier rounds.</li>" +
      "</ul></div></div>" +
      /* The sheet is paper: the space left at the foot is worth more as
         somewhere to write during the event than as margin. */
      '<div class="brief-write"><h3>Today, round by round</h3>' +
      "<ol>" + [1, 2, 3, 4, 5].map(function (n) {
        return "<li><span>vs</span><span></span></li>";
      }).join("") + "</ol></div></section>";
  }

  /* ---- page two: the field, and what was written down ---------------- */
  function fieldPage(ms, scopeLabel) {
    var played = opponentsPlayed(ms);
    var rows = (typeof matchupRows === "function" ? matchupRows(ms) : [])
      .filter(function (r) { return r.n || r.share >= 0.02; })
      .sort(function (a, b) { return b.share - a.share; })
      .slice(0, 16);

    var withRounds = rows.filter(function (r) { return r.n >= 2; });
    var best = withRounds.slice().sort(function (a, b) { return b.wr - a.wr; }).slice(0, 3);
    var bestIds = best.map(function (r) { return r.id; });
    var worst = withRounds
      .filter(function (r) { return bestIds.indexOf(r.id) < 0; })
      .sort(function (a, b) { return a.wr - b.wr; })
      .slice(0, 3);
    var blind = rows.filter(function (r) { return !r.n; }).slice(0, 4);
    var line = function (title, list, how) {
      if (!list.length) return "";
      return "<li><b>" + title + ":</b> " + list.map(how).join(", ") + "</li>";
    };

    var rank = function (id) {
      var r = typeof fieldRank !== "undefined" && fieldRank ? fieldRank.get(id) : null;
      if (!r) return "—";
      return "#" + r.rank + (r.shape ? " " + r.shape : "");
    };

    var ranked = typeof fieldRank !== "undefined" && fieldRank && fieldRank.size;
    var table = '<table class="brief-table"><thead><tr><th>Archetype</th><th>Field</th>' +
      (ranked ? "<th>In the field</th>" : "") +
      "<th>Your W–L–T</th><th>Your rate</th></tr></thead><tbody>" +
      rows.map(function (r) {
        var rec = played.get(r.id);
        return "<tr><td>" + esc(r.name) + "</td><td>" + pct(r.share, 1) + "</td>" +
          (ranked ? "<td>" + esc(rank(r.id)) + "</td>" : "") +
          "<td>" + (rec ? rec.w + "–" + rec.l + "–" + rec.t : "—") +
          "</td><td>" + (r.n ? pct(r.wr, 0) : "—") + "</td></tr>";
      }).join("") + "</tbody></table>";

    var reasons = reasonTally(ms).slice(0, 3);
    var s = typeof stats === "function" ? stats(ms) : null;
    var strip =
      '<div class="brief-strip">' +
      "<div><b>" + (s && s.n ? s.w + "–" + s.l + "–" + s.t : "—") + "</b><span>" +
      esc(scopeLabel) + "</span></div>" +
      "<div><b>" + (s && s.first != null ? pct(s.first, 0) : "—") + " / " +
      (s && s.second != null ? pct(s.second, 0) : "—") + "</b><span>on the play / on the draw</span></div>" +
      "<div><b>" + (reasons.length ? esc(REASONS_PL[reasons[0].key] || reasons[0].key) : "—") +
      "</b><span>most common way this deck loses" +
      (reasons.length ? " · " + plural(reasons[0].n, "game") : "") + "</span></div>" +
      "</div>";

    var notes = ms.filter(function (m) { return (m.note || "").trim() || (m.comment || "").trim(); })
      .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    var shown = notes.slice(0, MAX_TAKEAWAYS);
    var takeaways = shown.map(function (m) {
      var text = (m.note || "").trim() || (m.comment || "").trim();
      return '<li><span class="brief-opp">' + esc(nameOf(m.opp)) + "</span>" +
        '<span class="brief-when">' + esc(fmtDate(m.date)) + " · " + esc(m.result) + "</span>" +
        "<p>" + esc(trim(text, TAKEAWAY_CHARS)) + "</p></li>";
    }).join("");

    return '<section class="brief-page">' +
      "<h2>The field, and your own record</h2>" + table +
      '<ul class="brief-points">' +
      line("Your best", best, function (r) { return esc(r.name) + " " + pct(r.wr, 0); }) +
      line("Your worst", worst, function (r) { return esc(r.name) + " " + pct(r.wr, 0); }) +
      line("Common, never played", blind, function (r) { return esc(r.name) + " " + pct(r.share, 1); }) +
      "</ul>" + strip +
      "<h2>What you wrote down" +
      (notes.length > shown.length ? " <small>(" + shown.length + " most recent of " +
        notes.length + ")</small>" : "") + "</h2>" +
      (takeaways
        ? '<ul class="brief-notes">' + takeaways + "</ul>"
        : '<p class="brief-empty">No notes recorded yet. After each round, one sentence in ' +
          "“Main takeaway for next time” is what fills this page.</p>") +
      "</section>";
  }

  /* ---- the pocket card ------------------------------------------------ */
  function pocketCard(d, sum, ms, scopeLabel) {
    var played = opponentsPlayed(ms);
    var rows = (typeof matchupRows === "function" ? matchupRows(ms) : [])
      .filter(function (r) { return r.n >= 2; });
    var worst = rows.slice().sort(function (a, b) { return a.wr - b.wr; }).slice(0, 3);
    var notes = ms.filter(function (m) { return (m.note || "").trim(); })
      .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); })
      .slice(0, 3);
    var c = sum ? sum.counts : null;

    return '<section class="brief-page brief-card">' +
      "<h1>" + esc(d.name) + "</h1>" +
      '<p class="brief-sub">' + esc(scopeLabel) + "</p>" +
      '<div class="brief-figures">' +
      (sum && sum.L !== null
        ? figure((sum.score ? sum.inTen(sum.score.c1) : sum.inTen(sum.L)) + " in 10",
            "openings that work", "") +
          figure(sum.mulligan ? pct(sum.mulligan.p, 0) : "—", "mulligans", c.basic + " Basics") +
          figure(c.search + " / " + c.draw, "finds / draws", "")
        : "") +
      "</div>" +
      "<h3>Watch out for</h3><ul class=\"brief-tips\">" +
      (worst.length
        ? worst.map(function (r) {
            var rec = played.get(r.id);
            return "<li><b>" + esc(r.name) + "</b> — " + pct(r.wr, 0) +
              (rec ? " from " + rec.w + "–" + rec.l + "–" + rec.t : "") + "</li>";
          }).join("")
        : "<li>Not enough rounds yet to name a hard matchup.</li>") +
      "</ul><h3>Your own words</h3><ul class=\"brief-tips\">" +
      (notes.length
        ? notes.map(function (m) {
            return "<li><b>" + esc(nameOf(m.opp)) + ":</b> " + esc(trim(m.note, 150)) + "</li>";
          }).join("")
        : "<li>Nothing written down yet.</li>") +
      "</ul></section>";
  }

  /* ---- putting it on screen and on paper ------------------------------ */
  function sheet(html, size) {
    var old = document.getElementById("brief-sheet");
    if (old) old.remove();
    var page = document.getElementById("brief-page-size");
    if (page) page.remove();
    var style = document.createElement("style");
    style.id = "brief-page-size";
    style.textContent = "@page { size: " + size + "; margin: " +
      (size === "A5" ? "10mm" : "12mm") + "; }";
    document.head.appendChild(style);

    var box = document.createElement("div");
    box.id = "brief-sheet";
    box.innerHTML =
      '<div class="brief-bar"><span>Printing gives you a PDF: choose “Save as PDF” as the ' +
      "printer.</span><button class=\"button small\" id=\"brief-print\">Print / Save as PDF</button>" +
      '<button class="button small" id="brief-close">Close</button></div>' +
      '<div class="brief-paper">' + html + "</div>";
    document.body.appendChild(box);
    document.getElementById("brief-print").onclick = function () { window.print(); };
    document.getElementById("brief-close").onclick = function () {
      box.remove();
      var s = document.getElementById("brief-page-size");
      if (s) s.remove();
    };
    box.scrollIntoView();
  }

  function matchesFor(scope, d) {
    return scope === "deck" ? realMatches(d.id) : realMatches().concat(
      state.config.decks
        .filter(function (x) { return x.id !== d.id; })
        .flatMap(function (x) { return realMatches(x.id); }),
    );
  }

  function scopeText(scope, d, n) {
    return scope === "deck"
      ? plural(n, "round") + " with " + d.name
      : plural(n, "round") + " across every deck";
  }

  window.makeBrief = async function (kind, scope) {
    var d = deck();
    if (!d) return toast("Add a deck first.");
    /* The places in the field come from the report already on this computer.
       Reading it costs nothing and fetches nothing, but it has usually not
       happened yet on the page the brief is started from. */
    if (typeof loadFieldRank === "function" &&
        !(typeof fieldRank !== "undefined" && fieldRank && fieldRank.size)) {
      try { await loadFieldRank(); } catch (e) { /* the brief simply omits the column */ }
    }
    var sum = typeof window.consistencySummary === "function" ? window.consistencySummary(d) : null;
    /* A database in use before the update holds cards marked with the old
       four flags and no role. Start reading them again now - not waited for,
       because it can take a minute and the sheet is wanted straight away. */
    if (sum && sum.roles && sum.roles.unknown && typeof window.identifyDeck === "function")
      window.identifyDeck(d);

    var label = scopeText(scope, d, ms.length);
    var when = fmtDate(localDate());

      sheet(pocketCard(d, sum, ms, label), "A5");

      sheet(deckPage(d, sum, when) + fieldPage(ms, label), "A4");

  };

  window.openBriefDialog = function () {
    var d = deck();
    if (!d) return toast("Add a deck first.");
    modal(
      "Tournament brief",
      '<p class="hint">Two sheets of paper for the deck you have open, <b>' + esc(d.name) +
        "</b>. Everything comes from this computer; nothing is fetched.</p>" +
        '<div class="field"><label for="brief-scope">Rounds to count</label>' +
        '<select id="brief-scope"><option value="deck">Only rounds played with this deck</option>' +
        '<option value="all">Every round in the app, whatever deck</option></select>' +
        '<p class="hint">The card list and the consistency figures are always this deck\'s. ' +
        "This only decides which rounds stand behind your record against each archetype: a " +
        "narrower, cleaner sample, or a wider one that knows the opponent better.</p></div>" +
        '<div class="form-end"><button class="button" id="brief-make-card">Pocket card (A5)</button>' +
        '<button class="button primary" id="brief-make">Full brief (2 pages)</button></div>',
    );
    var scope = function () {
      var el = document.getElementById("brief-scope");
      return el ? el.value : "deck";
    };
    document.getElementById("brief-make").onclick = function () {
      var s = scope();
      closeDialog();
      window.makeBrief("brief", s);
    };
    document.getElementById("brief-make-card").onclick = function () {
      var s = scope();
      closeDialog();
      window.makeBrief("card", s);
    };
  };
})();

 *
 * A practice schedule, not a forecast. Everything here is arithmetic over
 * three things the app already holds: how often rounds actually get
 * recorded, which archetypes have been met and how often, and what the field
 * looks like in the loaded metagame. One new thing is stored - the event
 * itself - and nothing else.
 *
 * The rule the whole screen is written to: never promise a win rate. Sixteen

 * matchups already seen, lines already found and notes written while they

  /* ---- the dashboard card ------------------------------------------- */

      ". " +
      esc(plan.deck.name) +
      '.</p></div><button class="button small" data-action="set-event">Change the event</button></div>' +
      '<div class="plan-capacity"><div><p class="hint">You have recorded <b>' +
      plan.pace.week.toFixed(1) +
      " rounds a week</b> lately, so about <b>" +
      Math.round(plan.pace.week * plan.weeksLeft) +
      "</b> before the event. This plan asks for <b>" +
      plan.asked +
      "</b> and leaves the rest free.</p>" +
      '<div class="bar"><i style="width:' +
      (plan.asked ? Math.min(100, (plan.done / plan.asked) * 100) : 0).toFixed(0) +
      '%"></i></div><p class="hint">' +
      plan.done +
      " of " +
      plan.asked +
      " done — they tick themselves off as you record matches.</p></div>" +
      '<div class="plan-cov"><div class="total"><strong>' +
      pct(plan.coverage, 0) +
      "</strong><span>of the field met so far</span></div>" +
      '<div class="total"><strong class="good-text">' +
      pct(plan.coverageAfter, 0) +
      "</strong><span>if you play this plan</span></div></div></div>" +
      (plan.picks.length
        ? group(
            "meet",
            function (n) {
              return n === 1 ? "Meet this one before the day" : "Meet these before the day";
            },
            "Rounds against a deck you have never played do not settle a win rate. What they buy is knowing the " +
              "matchup — the first time you see it should not be round one.",
          ) +
          group(
            "fix",
            function (n) {
              return n === 1 ? "And work on this one" : "And work on these " + (n === 2 ? "two" : n);
            },
            "Here the matchup is known and going the wrong way. A handful of rounds turns a few games' worth of " +
              "guessing into a first reading — still not a verdict, but something you can act on.",
          )
        : '<p class="hint">Nothing to single out: every archetype in the field either has the rounds it needs or is ' +
          "going your way already. Keep recording and the plan will find something.</p>") +
      '<div class="plan-lock">' +
      (plan.lockPassed
        ? "<b>The list is locked.</b> It stopped changing on " +
          fmtDay(plan.lock) +
          ", so every round from here is played with the sixty cards you will bring." +
          (plan.listChangedAfterLock
            ? ' <span class="warn-text">A new version was saved after that date, so the rounds before it were played with a different list.</span>'
            : "")
        : "<b>The list locks on " +
          fmtDay(plan.lock) +
          ".</b> After that, practise with the sixty cards you will actually bring — what you learn then still applies on the day.") +
      "</div>" +
      '<details class="cons-maths"><summary>What this plan is, and what it is not</summary>' +
      "<p>It is a practice schedule built from what you play, how often you play it and what the field looks like this month. " +
      "It is not a forecast. " +
      plural(plan.asked, "round") +
      " spread over " +
      plural(plan.picks.length, "archetype") +
      " will not produce reliable win rates — even ten rounds against one deck leaves a range about twenty-five points wide. " +
      "What they do produce is matchups you have seen before, lines you have already found, and notes you wrote while it was fresh. " +
      "The numbers choose where the rounds go; they do not promise what the rounds will be worth.</p></details></div>"
    );
  };

  /* ---- naming the event --------------------------------------------- */
  window.openEventDialog = function () {
    var e = window.planEvent() || {};
    var day = asDate(e.date) || new Date(today().getTime() + 21 * 86400000);
    var lock = asDate(e.lockDate) || new Date(day.getTime() - LOCK_DAYS * 86400000);
    var decks = state.config.decks.filter(function (d) {
      return !d.archived;
    });
    modal(
      "What are you preparing for?",
      '<p class="hint">Everything else the plan needs it already has — your rounds, your list and the field.</p>' +
        '<form id="event-form"><div class="form-grid">' +
        '<div class="field full"><label for="ev-name">Event</label>' +
        '<input id="ev-name" maxlength="80" required value="' +
        esc(e.name || "") +
        '" placeholder="e.g. Regionals Gdańsk"></div>' +
        '<div class="field"><label for="ev-date">Date</label>' +
        '<input id="ev-date" type="date" required value="' +
        iso(day) +
        '"></div>' +
        '<div class="field"><label for="ev-deck">Deck you will bring</label><select id="ev-deck">' +
        decks
          .map(function (d) {
            return option(d.id, d.name, e.deck || state.config.active);
          })
          .join("") +
        "</select></div>" +
        '<div class="field full"><label for="ev-lock">Stop changing the list on</label>' +
        '<input id="ev-lock" type="date" value="' +
        iso(lock) +
        '">' +
        '<p class="hint">Five days out by default. After this date the plan treats the list as fixed, so what you ' +
        "practise is what you will play.</p></div></div>" +
        '<p class="error-text" id="event-error" role="alert"></p>' +
        '<div class="form-end">' +
        (window.planEvent()
          ? '<button type="button" class="button danger" id="event-clear">Remove the event</button>'
          : "") +
        '<button class="button primary">Build the plan</button></div></form>',
    );
    var form = document.getElementById("event-form");
    var dateBox = document.getElementById("ev-date");
    var lockBox = document.getElementById("ev-lock");
    var lockTouched = !!e.lockDate;
    lockBox.onchange = function () {
      lockTouched = true;
    };
    /* Moving the event has to move the lock with it, or a date chosen for the
       old day quietly stays behind and the plan locks the list a week early. */
    dateBox.onchange = function () {
      var d = asDate(dateBox.value);
      if (!d || lockTouched) return;
      lockBox.value = iso(new Date(d.getTime() - LOCK_DAYS * 86400000));
    };
    var clear = document.getElementById("event-clear");
    if (clear)
      clear.onclick = function () {
        commit(function (n) {
          delete n.config.nextEvent;
        }, { close: true });
      };
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var name = document.getElementById("ev-name").value.trim();
      var date = document.getElementById("ev-date").value;
      var err = document.getElementById("event-error");
      if (!name || !asDate(date)) {
        err.textContent = "The event needs a name and a date.";
        return;
      }
      if (asDate(date) < today()) {
        err.textContent = "That date has already passed.";
        return;
      }
      var lockValue = document.getElementById("ev-lock").value;
      commit(function (n) {
        n.config.nextEvent = {
          name: name,
          date: date,
          deck: document.getElementById("ev-deck").value,
          lockDate: asDate(lockValue) && asDate(lockValue) <= asDate(date) ? lockValue : "",
          setAt: (window.planEvent() || {}).setAt || Date.now(),
        };
      }, { close: true });
    };
  };
})();

;
/* Matchup Lab — the scan panel: photo or PDF in, reviewed rounds out.
 *
 * Nothing reaches the database without being shown first.  Every slot on the
 * sheet is listed, including the ones that read as empty, so a round can never
 * go missing quietly. */
(function () {
  "use strict";

  var spec = window.SCAN_LAYOUT || null;
  var result = null, note = "", working = false, sheetDate = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function opt(v, label, sel) {
    return '<option value="' + esc(v) + '"' + (String(sel) === String(v) ? " selected" : "") + ">"
      + esc(label) + "</option>";
  }

  /* ---- getting pixels out of whatever the person picked ------------------ */

  /* Decoded without a blob: URL, so the app's content-security policy stays as
     tight as it is. createImageBitmap needs no URL at all; the data: fallback
     is for older browsers, and data: is already allowed. */
  function readImage(blob) {
    if (typeof createImageBitmap === "function") {
      return createImageBitmap(blob).catch(function () { return viaDataUrl(blob); });
    }
    return viaDataUrl(blob);
  }

  function viaDataUrl(blob) {
    return new Promise(function (ok, fail) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () { ok(img); };
        img.onerror = function () { fail(new Error("This image could not be opened.")); };
        img.src = fr.result;
      };
      fr.onerror = function () { fail(new Error("This file could not be read.")); };
      fr.readAsDataURL(blob);
    });
  }

  function a85(bytes) {
    var out = [], tup = 0, n = 0;
    for (var i = 0; i < bytes.length; i++) {
      var c = bytes[i];
      if (c === 0x7e) break;                                  // ~> ends the data
      if (c <= 32 || c === 10 || c === 13) continue;
      if (c === 0x7a && n === 0) { out.push(0, 0, 0, 0); continue; }   // z = four zero bytes
      if (c < 33 || c > 117) continue;
      tup = tup * 85 + (c - 33); n++;
      if (n === 5) {
        out.push((tup >>> 24) & 255, (tup >>> 16) & 255, (tup >>> 8) & 255, tup & 255);
        tup = 0; n = 0;
      }
    }
    if (n > 1) {
      for (var k = n; k < 5; k++) tup = tup * 85 + 84;
      var full = [(tup >>> 24) & 255, (tup >>> 16) & 255, (tup >>> 8) & 255, tup & 255];
      for (var j = 0; j < n - 1; j++) out.push(full[j]);
    }
    return new Uint8Array(out);
  }

  async function inflate(bytes) {
    if (typeof DecompressionStream !== "function") return null;
    for (var i = 0; i < 2; i++) {
      try {
        var ds = new DecompressionStream(i ? "deflate-raw" : "deflate");
        var buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
        return new Uint8Array(buf);
      } catch (e) { /* try the other framing */ }
    }
    return null;
  }

  /* Scanners almost always wrap a JPEG; pull it straight out rather than
     carrying a PDF renderer around. Producers often stack an encoding filter
     in front of it, so unwrap those first. Anything else is reported honestly. */
  async function imageFromPdf(buf) {
    var b = new Uint8Array(buf), txt = "", CH = 0x8000;
    for (var o = 0; o < b.length; o += CH) {
      txt += String.fromCharCode.apply(null, b.subarray(o, Math.min(b.length, o + CH)));
    }
    var best = null, at = 0;
    while (true) {
      var s = txt.indexOf("stream", at);
      if (s < 0) break;
      var head = txt.slice(Math.max(0, s - 900), s);
      var start = s + 6;
      if (txt[start] === "\r") start++;
      if (txt[start] === "\n") start++;
      var e = txt.indexOf("endstream", start);
      if (e < 0) break;
      at = e + 9;
      if (!/\/Subtype\s*\/Image/.test(head) || !/\/DCTDecode/.test(head)) continue;
      var fm = head.match(/\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/);
      var chain = fm ? (fm[1].match(/\/[A-Za-z0-9]+/g) || []) : ["/DCTDecode"];
      var len = e - start;
      if (!best || len > best.len) best = { from: start, len: len, chain: chain };
    }
    if (!best) return null;

    var data = b.subarray(best.from, best.from + best.len);
    for (var i = 0; i < best.chain.length; i++) {
      var f = best.chain[i];
      if (f === "/DCTDecode") break;                       // what is left is the JPEG
      if (f === "/ASCII85Decode") { data = a85(data); continue; }
      if (f === "/FlateDecode") {
        var inf = await inflate(data);
        if (!inf) return null;
        data = inf; continue;
      }
      return null;                                        // an encoding we do not handle
    }
    if (!(data[0] === 0xff && data[1] === 0xd8)) return null;
    return new Blob([data], { type: "image/jpeg" });
  }

  /* ---- reading the sheet -------------------------------------------------- */

  function fail(msg) {
    result = null; note = msg; working = false; redraw();
  }

  function explain(code) {
    if (code === "corners") {
      return "The four black corner squares were not all found. Photograph the whole sheet, "
        + "flat and square on, with all four corners inside the frame.";
    }
    if (code === "orientation") return "The sheet could not be squared up. Try another photo, taken straight on.";
    if (code === "contrast") return "The photo is too dark or too washed out to tell a filled box from an empty one.";
    return "The sheet could not be read.";
  }

  async function handle(file) {
    if (!file) return;
    if (!spec) { fail("The sheet layout is missing from this build."); return; }
    working = true; note = ""; result = null; redraw();
    try {
      var img;
      if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
        var blob = await imageFromPdf(await file.arrayBuffer());
        if (!blob) {
          fail("No scanned page was found inside that PDF. Save the scan as JPEG or PNG, "
             + "or just photograph the sheet with your phone.");
          return;
        }
        img = await readImage(blob);
      } else {
        img = await readImage(file);
      }
      var out = window.MatchupScan.decode(img, spec);
      if (!out.ok) { fail(explain(out.error)); return; }
      out.rows = buildRows(out);
      result = out; working = false; note = ""; redraw();
    } catch (e) {
      fail(e && e.message ? e.message : "That file could not be read.");
    }
  }

  function buildRows(out) {
    var offset = out.page2 ? 6 : 0, rows = [];
    for (var i = 1; i <= out.slots; i++) {
      var found = null;
      for (var j = 0; j < out.rounds.length; j++) if (out.rounds[j].round === i) found = out.rounds[j];
      rows.push({
        slot: i + offset,
        use: !!found,
        opp: found ? found.opp : "",
        games: found ? found.games.slice() : [],
        reason: found ? found.reason : "",
        warn: found ? found.warn : [],
        needsName: found ? found.needsName : false
      });
    }
    return rows;
  }

  /* ---- the panel ---------------------------------------------------------- */

  function entries() {
    var e = (typeof state !== "undefined" && state.config && state.config.meta
             && state.config.meta.entries) || [];
    return e.length ? e : (spec ? spec.decks : []);
  }

  function gameCell(row, i) {
    var g = row.games[i] || null;
    var res = g ? g.r : "";
    var st = !g || g.first === undefined ? "" : (g.first ? "1" : "0");
    return '<td><select data-g="' + i + '" class="scan-res">'
      + opt("", "—", res) + opt("W", "W", res) + opt("L", "L", res) + opt("T", "T", res)
      + '</select><select data-g="' + i + '" class="scan-first">'
      + opt("", "?", st) + opt("1", "1st", st) + opt("0", "2nd", st) + "</select></td>";
  }

  function rowHtml(row, idx) {
    var warn = row.warn && row.warn.length;
    return '<tr data-row="' + idx + '"' + (warn ? ' class="scan-warn"' : "") + ">"
      + '<td><label class="scan-use"><input type="checkbox" class="scan-on"' + (row.use ? " checked" : "")
      + '><b>' + row.slot + "</b></label></td>"
      + '<td><select class="scan-opp">' + opt("", "— not read —", row.opp)
      + entries().map(function (e) { return opt(e.id, e.name, row.opp); }).join("") + "</select>"
      + (row.needsName ? '<div class="hint">Marked as “Other” — pick the real deck if you wrote it down.</div>' : "")
      + "</td>"
      + gameCell(row, 0) + gameCell(row, 1) + gameCell(row, 2)
      + '<td><select class="scan-reason">' + opt("", "—", row.reason)
      + (spec ? spec.reasons.map(function (c) {
          var label = (typeof REASONS_PL !== "undefined" && REASONS_PL[c]) || c;
          return opt(c, label, row.reason); }).join("") : "")
      + "</select></td>"
      + '<td class="hint">' + (warn ? esc("check " + row.warn.join(", ")) : "") + "</td></tr>";
  }

  function panel() {
    var head = '<div class="card" id="scan-card"><h2>Scan a paper sheet</h2>'
      + '<p class="hint">Fill in <b>Matchup Lab · Scan sheet</b> by hand, then photograph it or scan it. '
      + 'Everything it reads is shown for checking before anything is saved.</p>'
      + '<div class="actions"><button class="button primary" id="scan-pick">Choose a photo or PDF…</button>'
      + '<input type="file" id="scan-file" accept="image/*,application/pdf" capture="environment" hidden>'
      + (result ? '<button class="button" id="scan-reset">Start again</button>' : "")
      + "</div>";
    if (working) return head + '<p class="hint">Reading the sheet…</p></div>';
    if (note) return head + '<p class="error-text">' + esc(note) + "</p></div>";
    if (!result) return head + "</div>";

    var usable = result.rows.filter(function (r) { return r.use; }).length;
    var body = result.rows.map(rowHtml).join("");
    return head
      + '<div class="scan-meta"><span class="badge' + (usable ? " good" : "") + '">'
      + usable + " of " + result.rows.length + " slots read</span> "
      + '<span class="hint">Where played: <b>' + esc(result.where ? ((typeof EVENTS_PL !== "undefined"
          && EVENTS_PL[result.where]) || result.where) : "not marked") + "</b>"
      + (result.whereSure ? "" : " (unclear — set it below)") + "</span></div>"
      + (result.notes.length ? '<p class="hint">' + result.notes.map(esc).join(" ") + "</p>" : "")
      + '<div class="scan-wrap"><table class="scan-table"><thead><tr><th>Use</th><th>Opponent</th>'
      + "<th>Game 1</th><th>Game 2</th><th>Game 3</th><th>Reason</th><th></th></tr></thead><tbody>"
      + body + "</tbody></table></div>"
      + '<div class="form-grid" style="margin-top:14px">'
      + '<div class="field"><label for="scan-date">Date of these rounds</label>'
      + '<input id="scan-date" type="date" value="' + esc(sheetDate || (typeof localDate === "function"
          ? localDate() : new Date().toISOString().slice(0, 10))) + '"></div>'
      + '<div class="field"><label for="scan-event">Where played</label><select id="scan-event">'
      + (typeof EVENTS_PL !== "undefined"
          ? Object.keys(EVENTS_PL).map(function (k) { return opt(k, EVENTS_PL[k], result.where || "test"); }).join("")
          : "") + "</select></div></div>"
      + '<div class="actions"><button class="button primary" id="scan-save">Add the ticked rounds</button></div>'
      + "</div>";
  }

  function redraw() {
    var host = document.getElementById("scan-card");
    if (!host) { if (typeof render === "function") render(); return; }
    var tmp = document.createElement("div");
    tmp.innerHTML = panel();
    host.replaceWith(tmp.firstElementChild);
    bind();
  }

  function collect() {
    var card = document.getElementById("scan-card");
    if (!card || !result) return;
    [].forEach.call(card.querySelectorAll("tr[data-row]"), function (tr) {
      var row = result.rows[Number(tr.getAttribute("data-row"))];
      row.use = tr.querySelector(".scan-on").checked;
      row.opp = tr.querySelector(".scan-opp").value;
      row.reason = tr.querySelector(".scan-reason").value;
      var games = [];
      [].forEach.call(tr.querySelectorAll(".scan-res"), function (sel, i) {
        var st = tr.querySelectorAll(".scan-first")[i].value;
        if (!sel.value) return;
        var g = { r: sel.value };
        if (st) g.first = st === "1";
        games.push(g);
      });
      row.games = games;
    });
  }

  async function save() {
    collect();
    var date = (document.getElementById("scan-date") || {}).value || "";
    var event = (document.getElementById("scan-event") || {}).value || "test";
    var take = result.rows.filter(function (r) { return r.use && r.opp && r.games.length; });
    if (!take.length) { if (typeof toast === "function") toast("Nothing is ticked to add."); return; }

    var made = take.map(function (r) {
      var games = r.games.map(function (g) { return { r: g.r, first: g.first }; });
      if (r.reason) {
        for (var i = 0; i < games.length; i++) {
          if (games[i].r === "L") { games[i].reason = r.reason; break; }
        }
      }
      return {
        id: (typeof uid === "function" ? uid("m") : "m-" + Math.random().toString(36).slice(2)),
        date: date, myDeck: state.config.active, opp: r.opp,
        bo: games.length > 1 ? 3 : 1, games: games, event: event,
        note: "From the scan sheet · round " + r.slot,
        listVersion: (typeof deck === "function" && deck().currentVersion) || null
      };
    });
    var ok = await commit(function (n) { made.forEach(function (m) { n.matches.push(m); }); });
    if (ok !== false) {
      result = null; note = "";
      if (typeof toast === "function") {
        toast(made.length + (made.length === 1 ? " round added." : " rounds added."));
      }
      if (typeof render === "function") render();
    }
  }

  function bind() {
    var pick = document.getElementById("scan-pick"), file = document.getElementById("scan-file");
    if (pick && file) {
      pick.onclick = function () { file.click(); };
      file.onchange = function () { handle(this.files && this.files[0]); this.value = ""; };
    }
    var reset = document.getElementById("scan-reset");
    if (reset) reset.onclick = function () { result = null; note = ""; redraw(); };
    var sv = document.getElementById("scan-save");
    if (sv) sv.onclick = save;
  }

  window.renderScanPanel = panel;
  window.bindScan = bind;
})();

</script>
</body>
</html>
