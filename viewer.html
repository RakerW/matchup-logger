/* One scale for every win rate in the app: above 50 green, 45 to 50 amber,
   below 45 red. A figure resting on too few rounds is shown faded, so a 2-0
   start does not read like a solved matchup. */
function wrBand(v) {
  return v === null || v === undefined || isNaN(v)
    ? ""
    : v > 0.5 ? "wr-good" : v >= 0.45 ? "wr-mid" : "wr-bad";
}
function wrClass(v, eligible) {
  const band = wrBand(v);
  return band ? "wr " + band + (eligible === false ? " wr-thin" : "") : "";
}
function wrPct(v, d = 0, eligible = true) {
  const cls = wrClass(v, eligible);
  return cls ? `<span class="${cls}">${pct(v, d)}</span>` : pct(v, d);
}
const WR_MIN = 5;   // rounds below which a win rate is shown faded

/* A small colour mark so a deck is recognisable at a glance down a list. The
   hue comes from the identifier itself, so it is the same everywhere and needs
   no table to maintain and no image to load. One mark per row, nothing more:
   the win-rate colours carry the meaning, these only aid recognition. */
function deckHue(id) {
  let h = 0;
  const str = String(id || "");
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
function deckIcons(id) {
  // an <img> is a direct load, not a fetch, so the single-file edition cannot
  // intercept it: there is no server to ask and the request would just fail
  if (state.config.deckSprites === false || location.protocol === "file:") return [];
  const e = (state.config.meta.entries || []).find((x) => x.id === id);
  return e && e.icons ? e.icons.slice(0, 2) : [];
}
function deckMark(id) {
  if (!id) return "";
  const h = deckHue(id);
  const icons = deckIcons(id)
    .map((n) => `<img class="dicon" alt="" width="22" height="22" src="/api/sprite?name=${encodeURIComponent(n)}">`)
    .join("");
  return `<span class="dmark${icons ? " withicon" : ""}" aria-hidden="true"` +
    ` style="--dot-l:hsl(${h} 58% 44%);--dot-d:hsl(${h} 52% 64%)">${icons}</span>`;
}

/* The content policy forbids event handlers written into the markup, so the
   fallback is wired here. Sizing no longer depends on this running: a sprite
   that cannot be fetched is removed and the colour square comes back. */
function wireDeckIcons(root) {
  (root || document).querySelectorAll("img.dicon:not([data-wired])").forEach((img) => {
    img.setAttribute("data-wired", "1");
    if (img.complete && img.naturalWidth === 0) return drop(img);
    img.addEventListener("error", () => drop(img));
  });
  function drop(img) {
    const holder = img.closest(".dmark");
    img.remove();
    if (holder && !holder.querySelector("img")) holder.classList.remove("withicon");
  }
}


function kpi(label, value, note, hero = false, cls = "") {
  return `<div class="card kpi${hero ? " hero" : ""}"><label>${esc(label)}</label><strong${cls ? ` class="${cls}"` : ""}>${esc(value)}</strong><p>${esc(note)}</p></div>`;
}
function empty(heading, text, button = "") {
  return `<div class="empty"><strong>${esc(heading)}</strong><p>${esc(text)}</p>${button}</div>`;
}
function realMatches(deckId = state.config.active) {
  return state.matches.filter((m) => m.myDeck === deckId && !m.demo);
}
/* Everything ever recorded, across every deck, in one line at the top of the
   page. The tiles below it all speak about the deck in hand; this answers a
   different question - how much is in here altogether - and a running total
   is the kind of number that makes you want to add to it. */
function allTimeBar() {
  const ms = state.matches.filter((m) => m.demo !== true);
  if (!ms.length) return "";
  const s = stats(ms);
  const first = ms.reduce((a, m) => (m.ts < a ? m.ts : a), Date.now());
  const cell = (value, label, cls = "") =>
    `<div class="total"><strong${cls ? ` class="${cls}"` : ""}>${esc(String(value))}</strong>` +
    `<span>${esc(label)}</span></div>`;
  return (
    `<div class="totals-bar" aria-label="Everything recorded so far">` +
    cell(s.n, "rounds recorded") +
    cell(s.w, "won", "wr wr-good") +
    cell(s.l, "lost", "wr wr-bad") +
    cell(s.t, "tied", s.t ? "wr wr-mid" : "") +
    cell(pct(s.wr, 1), "win rate", wrClass(s.wr, s.n >= WR_MIN)) +
    cell(s.games, "single games") +
    `<div class="total since"><strong>${new Date(first).toLocaleDateString("en-GB")}</strong>` +
    `<span>first round</span></div>` +
    `</div>`
  );
}
function stats(ms) {
  const n = ms.length,
    w = ms.filter((m) => m.result === "W").length,
    l = ms.filter((m) => m.result === "L").length,
    t = n - w - l;
  const games = ms.flatMap((m) => m.games);
  const rate = (a) =>
    a.length
      ? a.reduce((s, g) => s + (g.r === "W" ? 1 : g.r === "T" ? 0.5 : 0), 0) / a.length
      : null;
  return {
    n,
    w,
    l,
    t,
    wr: n ? (w + 0.5 * t) / n : null,
    games: games.length,
    gameWr: rate(games),
    first: rate(games.filter((g) => g.first === true)),
    second: rate(games.filter((g) => g.first === false)),
  };
}

/* ---- how a deck fares across the whole field ----------------------------
   The trends analysis already works this out: for every archetype it has an
   expected win rate across the metagame, weighted by how much of the field
   each opponent is, and a spread saying whether that average comes from
   beating everyone a little or from crushing half and losing to the rest.
   Its rating rewards the first and punishes the second. Both tables borrow
   that ranking rather than inventing a second one, so one deck cannot be
   third in one place and eighth in another. Nothing is fetched here: if the
   analysis has not been run, the column simply says so. */
let fieldRank = null, fieldRankAt = 0, fieldRankBusy = false;
/* The ranking behind the "In the field" column comes from a trend report.
   It used to ask for the report matching today's default filters, which on a
   fresh install - and on any day after the one a report was built - matched
   nothing at all, so the whole column sat on dashes. It now asks for the
   most recent report this computer holds, exactly as the matrix does, and
   asks again rather than once per session, so fetching an analysis in Trends
   fills the column straight away. */
async function loadFieldRank() {
  if (fieldRankBusy) return fieldRank;
  fieldRankBusy = true;
  fieldRankAt = Date.now();
  try {
    const j = await api("/api/trends/latest");
    const report = j.report?.analysis || j.report || {};
    const rows = (report.evaluated || []).filter((r) => r.eligible && r.universalScore != null);
    if (!rows.length) return (fieldRank = null);
    const order = [...rows].sort((a, b) => b.universalScore - a.universalScore);
    fieldRank = new Map();
    order.forEach((r, i) => {
      fieldRank.set(r.id, {
        rank: i + 1,
        of: order.length,
        score: r.universalScore,
        expected: r.expected,
        spread: r.spread,
        // the same absolute thresholds the Trends page uses, so "even"
        // means one thing in the whole app
        shape: typeof shapeOf === "function" ? shapeOf(r.spread) : "",
      });
    });
  } catch {
    fieldRank = null;
  } finally {
    fieldRankBusy = false;
  }
  return fieldRank;
}
/* Called when a newly built report lands, so the column does not keep
   yesterday's places until the app is restarted. */
window.reloadFieldRank = function () {
  fieldRankAt = 0;
  return loadFieldRank().then((r) => {
    if (page === "matchups" || page === "consistency") render();
    return r;
  });
};
function fieldRankCell(id) {
  if (!fieldRank) return '<td class="num" data-label="In the field">—</td>';
  const r = fieldRank.get(id);
  if (!r) return '<td class="num" data-label="In the field"><span class="hint">not rated</span></td>';
  const band = r.rank <= Math.ceil(r.of / 3) ? "good" : r.rank > Math.ceil((2 * r.of) / 3) ? "bad" : "warn";
  return (
    `<td class="num" data-label="In the field"><strong class="wr wr-${band}">#${r.rank}</strong>` +
    (r.shape ? ` <span class="badge ${r.shape === "even" ? "good" : "warn"}">${r.shape}</span>` : "") +
    "</td>"
  );
}

function matchupRows(ms = realMatches()) {
  const rows = state.config.meta.entries
    .filter((e) => e.id !== "other")
    .map((e) => ({
      ...e,
      share: e.share / 100,
      field: e.wr == null ? null : e.wr / 100,
      ...stats(ms.filter((m) => m.opp === e.id)),
    }));
  for (const id of new Set(ms.map((m) => m.opp))) {
    if (!rows.some((r) => r.id === id))
      rows.push({
        id,
        name: nameOf(id),
        share: 0,
        field: null,
        ...stats(ms.filter((m) => m.opp === id)),
      });
  }
  return rows;
}
function coverage(rows) {
  return rows.filter((r) => r.n).reduce((s, r) => s + r.share, 0);
}
function recommendation() {
  /* While a tournament plan is running it already says which matchup to
     practise, and says it with the date and the count. A second card making
     the same suggestion in different words is the kind of doubling the
     dashboard was just cleared of. */
  if (window.planEvent && window.planEvent() && window.tournamentPlan()?.picks.length)
    return {
      kind: "drill",
      title: "A good moment for a short drill",
      body: "The plan below says which matchups to practise. Between rounds, prizes, probability or damage math.",
      label: "YOUR NEXT STEP",
    };
  const rows = matchupRows();
  const target = parseFloat(state.config.target) || 0.55;
  const weak = rows
    .filter((r) => r.n >= 5 && r.wr < target && r.share > 0)
    .sort((a, b) => b.share * (target - b.wr) - a.share * (target - a.wr));
  if (weak.length)
    return {
      kind: "improve",
      row: weak[0],
      deck: weak[0].id,
      title: "Practise " + weak[0].name,
      /* esc() runs over this text where the card is built, so the figure goes
         in as a plain number: wrPct returns a coloured <span>, which came out
         as visible markup. */
      body: `Your win rate is ${pct(weak[0].wr, 0)} from ${plural(weak[0].n, "round")}. This archetype is ${pct(weak[0].share, 1)} of the field analysed. Plan a practice round and note one mistake to fix.`,
      label: "TRAINING TARGET",
    };
  const unknown = rows.filter((r) => r.n < 5 && r.share > 0).sort((a, b) => b.share - a.share);
  if (unknown.length)
    return {
      kind: "test",
      row: unknown[0],
      deck: unknown[0].id,
      title: "Learn the matchup: " + unknown[0].name,
      body: unknown[0].n
        ? `You have only ${plural(unknown[0].n, "round")}. Play more before judging this matchup.`
        : `You have no results against this archetype yet, and it is ${pct(unknown[0].share, 1)} of the field analysed. Start with three practice rounds.`,
      label: "FILL A GAP",
    };
  return {
    kind: "drill",
    title: "A good moment for a short drill",
    body: "Practise prizes, probability or damage math. Every session is tied to the active deck.",
    label: "YOUR NEXT STEP",
  };
}
/* Rounds recorded on a phone carry no deck this computer knows. On a file
   import they are attached during the preview, but rounds arriving through

function combinations(n, k) {

}

async function checkDrill() {

    detail = "",
    feedback = "";

    if (s.picks.length !== 6) {
      $("#drill-error").textContent = "Pick exactly six cards.";
      return;
    }
    const remaining = s.q.prizes.map((c) => c.key);
    let hits = 0;
    s.picks.forEach((c) => {

    });

    stopSession();

      (s.kind === "odds" && (answer < 0 || answer > 100)) ||

/* The single-file edition has no server to ask, but the Limitless API sends
   access-control-allow-origin: *, so the page can run the same search itself.
   Same rule as the server: a complete 60-card list, best placing wins. */
async function decklistFromBrowser(deckId) {
  const API = "https://play.limitlesstcg.com/api";
  const get = async (p) => {
    const r = await fetch(API + p);
    if (!r.ok) throw Error("Limitless answered " + r.status + ".");
    return r.json();
  };
  const events = (await get("/tournaments?game=PTCG&format=STANDARD&limit=60")).filter(
    (t) => (t.players || 0) >= 60,
  );
  let best = null,
    scanned = 0;
  for (const ev of events.slice(0, 10)) {
    let standings;
    try {
      standings = await get("/tournaments/" + ev.id + "/standings");
    } catch {
      continue;
    }
    scanned++;
    for (const row of standings) {
      if (row.deck?.id !== deckId) continue;
      const dl = row.decklist;
      if (!dl || typeof dl !== "object") continue;
      const cards = [];
      let total = 0;
      for (const g of ["pokemon", "trainer", "energy"]) {
        for (const c of dl[g] || []) {
          const n = Number(c.count) || 0;
          if (n <= 0 || !c.name) continue;
          total += n;
          cards.push({ n, name: String(c.name).trim(), set: String(c.set || "").trim(),
                       number: String(c.number || "").trim() });
        }
      }
      if (total !== 60) continue;
      const placing = Number(row.placing) || 999;
      if (!best || placing < best.placing)
        best = { deck: deckId, deckName: row.deck?.name || deckId, cards, total, placing,
                 player: row.player || "", event: ev.name || ev.id,
                 eventDate: (ev.date || "").slice(0, 10), eventPlayers: ev.players || 0 };
    }
    if (best && best.placing <= 8) break;
  }
  if (!best)
    throw Error(
      "No complete 60-card list for this archetype appeared in the last " + scanned +
        " events on Limitless. Paste your own list instead.",
    );
  return best;
}

function parseList(text) {
  const found = new Map();
  let ignored = 0;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /^(Pok[eé]mon|Trainer|Energy|Total Cards|Total)\s*[:：]/i.test(line)) continue;
    const match = line.match(/^(\d{1,2})\s+(.+)$/);
    if (!match) {
      ignored++;
      continue;
    }
    const n = Number(match[1]);
    if (!n || n > 60) throw Error("Invalid number of copies on line: " + line);
    let name = match[2].trim(),
      set = "",
      number = "";
    const suffix = name.match(/^(.+?)\s+([A-Z][A-Z0-9-]{1,7})\s+(\d{1,3}[A-Za-z]?(?:\/\d{1,3})?)$/);
    if (suffix) {
      [, name, set, number] = suffix;
    }
    const key = [name, set, number].join("|");
    const item = found.get(key) || { name, set, number, key, n: 0 };
    item.n += n;
    if (item.n > 60) throw Error("Too many copies of a card: " + name);
    found.set(key, item);
  }
  return {
    cards: [...found.values()],
    ignored,
    total: [...found.values()].reduce((s, c) => s + c.n, 0),
  };
}

/* ---- comparing two saved versions of one list --------------------------
   The deterministic half leads: what the sixty cards can do has no sample
   size in it and nothing to argue with. The records follow, with what they
   are worth stated plainly - they were played in different weeks against
   different people, so they are what happened, never what the change did. */

const SAME_DECK = 0.5;        // below this the two lists are not one deck
const listDiff = (a, b) => window.listDiff(a, b);

function versionRounds(d, versionId) {
  return realMatches(d.id).filter((m) => m.listVersion === versionId);
}

function dateRange(ms) {
  if (!ms.length) return "";
  const ds = ms.map((m) => m.date).sort();
  const nice = (s) => fmtDate(s);
  return ds[0] === ds.at(-1) ? nice(ds[0]) : nice(ds[0]) + " – " + nice(ds.at(-1));
}

/* The only half-fair reading in the whole screen: archetypes met under both
   lists. Everything else compares two different weeks. */
function likeForLike(d, va, vb) {
  const byOpp = (ms) => {
    const m = new Map();
    ms.forEach((x) => {
      const r = m.get(x.opp) || { n: 0, w: 0, l: 0, t: 0 };
      r.n++;
      if (x.result === "W") r.w++;
      else if (x.result === "L") r.l++;
      else r.t++;
      m.set(x.opp, r);
    });
    return m;
  };
  const a = byOpp(versionRounds(d, va)),
    b = byOpp(versionRounds(d, vb));
  const rows = [];
  a.forEach((ra, opp) => {
    const rb = b.get(opp);
    if (rb) rows.push({ opp, a: ra, b: rb });
  });
  rows.sort((p, q) => q.a.n + q.b.n - (p.a.n + p.b.n));
  return rows;
}

/* `deltaFormat` is separate on purpose: the gap between two percentages is
   measured in percentage points, not in percent, and writing it as "+4%"
   would be a different claim from the one the figures support. */
function measureRow(label, note, a, b, format, better, deltaFormat, show) {
  const head = `<tr><td>${esc(label)}${note ? ` <span class="hint">— ${esc(note)}</span>` : ""}</td>`;
  const f = format || ((v) => String(v));
  const cell = (v, strong) => {
    const t = show ? show(v) : v === null || v === undefined ? "—" : f(v);
    return `<td class="num">${strong ? `<strong>${esc(t)}</strong>` : esc(t)}</td>`;
  };
  if (a === null || a === undefined || b === null || b === undefined)
    return head + cell(a) + cell(b, true) + `<td class="num">—</td></tr>`;
  const same = Math.abs(b - a) < 1e-9;
  const up = b > a;
  const good = same ? null : better === "down" ? !up : up;
  const cls = same ? "" : good ? "good-text" : "warn-text";
  const df = deltaFormat || f;
  const delta = same ? "same" : (up ? "+" : "−") + df(Math.abs(b - a)).replace(/^[+−-]/, "");
  return head + cell(a) + cell(b, true) +
    `<td class="num ${cls}"><strong>${esc(delta)}</strong></td></tr>`;
}

const ppDelta = (v) => (100 * v).toFixed(1).replace(/\.0$/, "") + " pp";

function compareVersions(deckId, idA, idB) {
  const d = state.config.decks.find((x) => x.id === deckId);
  const va = (d.versions || []).find((v) => v.id === idA);
  const vb = (d.versions || []).find((v) => v.id === idB);
  if (!d || !va || !vb) return;

  const diff = listDiff(va.list, vb.list);
  const bigger = Math.max(
    (va.list || []).reduce((s, c) => s + c.n, 0),
    (vb.list || []).reduce((s, c) => s + c.n, 0),
    1,
  );
  const overlap = diff.shared / bigger;
  const ma = window.listMeasures(d, va.list);
  const mb = window.listMeasures(d, vb.list);
  const ra = stats(versionRounds(d, idA));
  const rb = stats(versionRounds(d, idB));

  /* Two lists that share almost nothing are two decks. Setting their records
     side by side would read as a verdict on a change nobody made. */
  const guard =
    overlap < SAME_DECK
      ? `<div class="cons-guard"><b>These are two different decks.</b> ${esc(va.label)} and ${esc(vb.label)} have ` +
        `${diff.shared} of ${bigger} cards in common. What each list can do on its own is still worth reading; their ` +
        `records are not set against each other below, because there is no change here to credit.</div>`
      : "";

  const changeRow = (r, sign) =>
    `<li><span class="cons-diff-n ${sign > 0 ? "good-text" : "bad-text"}">${sign > 0 ? "+" : "−"}${r.by}</span>` +
    `<span>${esc(r.name)} <span class="hint">(${r.from} → ${r.to})</span></span></li>`;

  const lineRow = (m, other) => {
    const key = (x) => (x.line.top ? x.line.top.name : x.line.mid.name);
    return m.lines
      .map((x) => {
        const mate = other.lines.find((y) => key(y) === key(x));
        /* A Stage 2 with no Rare Candy cannot arrive on turn two at all. That
           is a rule, not a low probability, so it is not written as 0%. */
        if (x.on.noCandy || (mate && mate.on.noCandy))
          return `<tr><td>${esc(key(x))} on turn 2</td>` +
            `<td class="num">${x.on.noCandy ? "turn 3" : pct(x.on.p, 0)}</td>` +
            `<td class="num"><strong>${mate ? (mate.on.noCandy ? "turn 3" : pct(mate.on.p, 0)) : "—"}</strong></td>` +
            `<td class="num hint">no Rare Candy</td></tr>`;
        return measureRow(
          key(x) + " on turn 2",
          null,
          x.on.p,
          mate ? mate.on.p : null,
          (v) => pct(v, 0),
          "up",
          ppDelta,
        );
      })
      .join("");
  };

  const rolesRow = (name, label, note, better) =>
    measureRow(label, note, ma.roles[name], mb.roles[name], (v) => String(v), better);

  const records =
    overlap < SAME_DECK
      ? ""
      : `<h3>What happened with each</h3>` +
        `<p class="hint cons-warn-note"><b>These two records are not a comparison.</b> Different opponents, different ` +
        `weeks, and your own play moved on in between. Read them as what happened, never as what the change did.</p>` +
        `<div class="table-wrap"><table class="table"><thead><tr><th>List</th><th>Played</th>` +
        `<th class="num">Rounds</th><th class="num">Record</th><th class="num">Win rate</th></tr></thead><tbody>` +
        [
          [va, ra, idA],
          [vb, rb, idB],
        ]
          .map(
            ([v, s]) =>
              `<tr><td><strong>${esc(v.label)}</strong></td><td class="hint">${esc(dateRange(versionRounds(d, v.id)) || "no rounds yet")}</td>` +
              `<td class="num">${s.n}</td><td class="num">${s.n ? `${s.w}–${s.l}–${s.t}` : "—"}</td>` +
              `<td class="num"><strong class="${wrClass(s.wr, s.n >= WR_MIN)}">${s.n ? pct(s.wr, 0) : "—"}</strong></td></tr>`,
          )
          .join("") +
        `</tbody></table></div>` +
        (() => {
          const rows = likeForLike(d, idA, idB);
          if (!rows.length)
            return `<div class="cons-like"><h4>Like for like</h4><p class="hint">No archetype has been met under both ` +
              `lists yet. Until one has, there is nothing here that compares the two.</p></div>`;
          const enough = rows.filter((r) => r.a.n >= WR_MIN && r.b.n >= WR_MIN);
          return `<div class="cons-like"><h4>Like for like</h4><p class="hint">Only what was met under both lists. ` +
            (enough.length
              ? `${plural(enough.length, "archetype")} ${enough.length === 1 ? "has" : "have"} at least ${WR_MIN} rounds on each side.`
              : `Nothing here has ${WR_MIN} rounds on each side yet, so treat every line as a note rather than a result.`) +
            `</p><div class="table-wrap"><table class="table"><thead><tr><th>Archetype</th>` +
            `<th class="num">${esc(va.label)}</th><th class="num">${esc(vb.label)}</th></tr></thead><tbody>` +
            rows
              .map(
                (r) =>
                  `<tr><td><div class="table-name">${deckMark(r.opp)}${esc(nameOf(r.opp))}</div></td>` +
                  `<td class="num">${r.a.w}–${r.a.l}–${r.a.t} <span class="hint">(${plural(r.a.n, "round")})</span></td>` +
                  `<td class="num">${r.b.w}–${r.b.l}–${r.b.t} <span class="hint">(${plural(r.b.n, "round")})</span></td></tr>`,
              )
              .join("") +
            `</tbody></table></div></div>`;
        })();

  const why = [va, vb]
    .filter((v) => (v.note || "").trim())
    .map(
      (v) =>
        `<li><b>${esc(v.label)}</b> — “${esc(v.note)}” <span class="hint">${esc(prettyTime(v.createdAt))}</span></li>`,
    )
    .join("");

  modal(
    `${va.label} next to ${vb.label}`,
    guard +
      `<p class="hint">${esc(d.name)} · ${diff.shared} of ${bigger} cards unchanged · ` +
      `${diff.out.length + diff.in.length} ${diff.out.length + diff.in.length === 1 ? "entry" : "entries"} differ.</p>` +
      (why ? `<ul class="cons-why">${why}</ul>` : "") +
      `<h3>What changed</h3>` +
      (diff.in.length + diff.out.length
        ? `<div class="cons-diff"><div><p class="hint">OUT</p><ul>${diff.out.map((r) => changeRow(r, -1)).join("") || '<li class="hint">nothing</li>'}</ul></div>` +
          `<div><p class="hint">IN</p><ul>${diff.in.map((r) => changeRow(r, 1)).join("") || '<li class="hint">nothing</li>'}</ul></div></div>`
        : `<p class="hint">The two lists hold exactly the same cards.</p>`) +
      `<h3>What the sixty cards can do</h3>` +
      `<p class="hint">Worked out from the lists themselves, so there is no sample size here. This is the part of the ` +
      `comparison that holds.</p>` +
      `<div class="table-wrap"><table class="table"><thead><tr><th>Measure</th>` +
      `<th class="num">${esc(va.label)}</th><th class="num">${esc(vb.label)}</th><th class="num">Change</th>` +
      `</tr></thead><tbody>` +
      measureRow("Works by turn 2", "a Basic, two engine cards and an energy", ma.L, mb.L, (v) => v.toFixed(2)) +
      measureRow("Mulligan chance", null, ma.mull, mb.mull, (v) => pct(v, 1), "down", ppDelta) +
      lineRow(ma, mb) +
      rolesRow("gust", "Gust effects", null) +
      rolesRow("drawSup", "Draw Supporters", null) +
      rolesRow("pokeSearch", "Pokémon-search items", null) +
      measureRow("Basics", null, ma.basic, mb.basic, (v) => String(v)) +
      measureRow("Energy", null, ma.energy, mb.energy, (v) => String(v)) +
      rolesRow("ace", "ACE SPEC", "exactly one is legal") +
      `</tbody></table></div>` +
      (ma.unknown || mb.unknown
        ? `<p class="hint"><span class="badge warn">PARTLY UNREAD</span> ${ma.unknown || mb.unknown} card` +
          `${(ma.unknown || mb.unknown) === 1 ? " is" : "s are"} not in the card database yet, so the role counts above ` +
          `are short by that much. Open Consistency once to read them.</p>`
        : "") +
      records,
    { wide: true },
  );
}

function deleteDeck(id) {
  const d = state.config.decks.find((x) => x.id === id);

  if (state.config.decks.length <= 1) {

  }
  const rounds = state.matches.filter((m) => m.myDeck === id && !m.demo);
  const attempts = state.drills.filter((x) => x.deck === id);
  const others = state.config.decks.filter((x) => x.id !== id);
  const moveTo = others.length
    ? `<div class="field" style="margin-top:14px"><label for="deck-rounds">What happens to them</label><select id="deck-rounds"><option value="move">Keep them — move to another deck</option><option value="drop">Delete them with the deck</option></select></div><div class="field" style="margin-top:10px" id="deck-target-field"><label for="deck-target">Move to</label><select id="deck-target">${others
        .map((x) => option(x.id, x.name, ""))
        .join("")}</select></div>`
    : "";
  modal(
    "Delete deck",
    `<p>Delete <b>${esc(d.name)}</b>?</p>` +
      (rounds.length || attempts.length
        ? `<p class="hint">${plural(rounds.length, "round")} and ${plural(
            attempts.length,
            "training attempt",
          )} are recorded against it.</p>${moveTo}`
        : `<p class="hint">Nothing is recorded against it, so nothing else changes.</p>`) +
      `<p class="hint" style="margin-top:14px">The deck disappears from every computer sharing this database. Deleted rounds go to the Trash in Settings, where they can be restored.</p>` +
      `<div class="form-end"><button class="button" data-action="close">Cancel</button><button class="button danger" id="confirm-delete-deck">Delete deck</button></div>`,
  );
  const mode = $("#deck-rounds");
  if (mode)
    mode.onchange = () => {
      $("#deck-target-field").hidden = mode.value !== "move";
    };
  $("#confirm-delete-deck").onclick = async () => {
    const keep = !mode || mode.value === "move";
    const target = $("#deck-target")?.value;
    const ok = await commit(
      (n) => {
        if (keep && target) {
          n.matches.forEach((m) => {
            if (m.myDeck === id) m.myDeck = target;
          });
          n.drills.forEach((x) => {
            if (x.deck === id) x.deck = target;
          });
        } else {
          const doomed = n.matches.filter((m) => m.myDeck === id);
          doomed.forEach((m) =>
            n.trash.push({ id: uid("trash"), kind: "match", item: clone(m), ts: Date.now() }),
          );
          n.matches = n.matches.filter((m) => m.myDeck !== id);
          n.drills = n.drills.filter((x) => x.deck !== id);
        }
        n.config.decks = n.config.decks.filter((x) => x.id !== id);
        if (n.config.active === id)
          n.config.active = (n.config.decks.find((x) => !x.archived) || n.config.decks[0]).id;
        if (n.config.trainingDeck === id) n.config.trainingDeck = n.config.active;
      },
      { close: true },
    );
    if (ok !== false) toast(`“${d.name}” deleted.`);
  };
}

function download(filename, text, type = "application/json") {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Rounds recorded on the phone cannot know the deck id used on this computer,
   and any round pointing at a missing deck would sit in the database while
   being invisible in every view. Those are attached to the active deck on
   import, and the preview says how many. */
function adoptOrphanRounds(matches, decks, activeId) {
  const known = new Set((decks || []).map((d) => d.id));
  const byName = new Map((decks || []).map((d) => [normalName(d.name), d.id]));
  let adopted = 0;
  for (const m of matches || []) {
    if (known.has(m.myDeck)) continue;
    const hit = m.deckName && byName.get(normalName(m.deckName));
    if (hit) {
      m.myDeck = hit;            // the name it was recorded under exists here
      continue;
    }
    m.myDeck = activeId;
    adopted++;
  }
  return adopted;
}
function previewImport(raw, label = "file") {
  let imported;
  try {
    imported = migrate(raw);
  } catch (e) {
    toast("Import rejected: " + e.message);
    return;
  }
  // decks that travel with the file count as known, so only true orphans move
  const orphans = adoptOrphanRounds(
    imported.matches,
    [...state.config.decks, ...(imported.config.decks || [])],
    state.config.active,
  );
  const same = imported.matches.filter((m) => state.matches.some((x) => x.id === m.id));
  const changed = same.filter(
    (m) => JSON.stringify(m) !== JSON.stringify(state.matches.find((x) => x.id === m.id)),
  ).length;
  modal(
    "Check the import before saving",
    `<p class="hint">Source: ${esc(label)}. We will back up the current database on disk before importing.</p><div class="import-preview"><strong>${imported.matches.length} matches · ${imported.drills.length} attempts · ${imported.config.decks.length} decks</strong>${orphans ? `<p class="hint">${orphans} round${orphans === 1 ? "" : "s"} carry no deck this computer knows — recorded on a phone, most likely. They will be attached to <b>${esc(deck().name)}</b>.</p>` : ""}<p class="hint">Match ids in common: ${same.length}, of which differing entries: ${changed}. When merging, an imported entry with the same id replaces the local one. Deck version history is combined.</p></div><div class="field"><label for="import-mode">Import mode</label><select id="import-mode"><option value="merge">Merge with the current database</option><option value="replace">Replace the whole database with the backup</option></select></div><p class="hint" id="import-mode-hint">Merging keeps entries that are missing from the imported file.</p><label class="checkline"><input type="checkbox" id="import-confirm">I understand how entries in common will be resolved.</label><div class="form-end"><button class="button" data-action="close">Cancel</button><button class="button primary" id="confirm-import">Import data</button></div>`,
  );
  $("#import-mode").onchange = () =>
    ($("#import-mode-hint").textContent =
      $("#import-mode").value === "replace"
        ? "Replacing removes entries that are absent from the backup. The archive made before the import stays on disk."
        : "Merging keeps entries that are absent from the imported file.");
  $("#confirm-import").onclick = async () => {
    if (!$("#import-confirm").checked) {
      toast("Tick the confirmation once you have checked the preview.");
      return;
    }
    const mode = $("#import-mode").value;
    await commit(
      (n) => {
        const revision = n._revision;
        if (mode === "replace") {
          n.config = clone(imported.config);
          n.matches = clone(imported.matches);
          n.drills = clone(imported.drills);
          n.trash = clone(imported.trash);
        } else {
          const union = (a, b) => [...new Map([...a, ...b].map((x) => [x.id, x])).values()];
          n.matches = union(n.matches, imported.matches);
          n.drills = union(n.drills, imported.drills);
          n.trash = union(n.trash, imported.trash);
          const decks = new Map(n.config.decks.map((d) => [d.id, d]));
          for (const incoming of imported.config.decks) {
            const old = decks.get(incoming.id);
            decks.set(
              incoming.id,
              old
                ? {
                    ...old,
                    ...incoming,
                    versions: union(old.versions || [], incoming.versions || []),
                  }
                : incoming,
            );
          }

const META_MAX_AGE_HOURS = 12;

function metaAgeMs() {
  const at = Number(state.config.meta?.fetchedAt || 0) * 1000;
  return at ? Date.now() - at : Infinity;
}

/* Runs once after the first paint. It never blocks the app, never reports a
   failure (being offline is not an error worth a dialog at startup), and leans
   on the server's cache so a second launch the same morning costs nothing. */
async function autoRefreshMeta() {
  if (!connected || state.config.autoMeta === false) return;
  if (metaAgeMs() < META_MAX_AGE_HOURS * 3600e3) return;
  await new Promise((r) => setTimeout(r, 1500));
  if (busy || pending) return;
  try {
    const j = await api("/api/limitless?maxAge=" + META_MAX_AGE_HOURS * 3600);
    if (!j.entries?.length) return;
    if (Number(j.fetchedAt || 0) <= Number(state.config.meta?.fetchedAt || 0)) return;
    if (busy || pending) return;
    const ok = await commit((n) => {
      n.config.meta = j;
    }, { background: true });
    if (ok !== false) {
      toast("Metagame updated from Limitless.");
      if (page === "settings" || page === "trends" || page === "matchups") render();
    }
  } catch {
    /* no connection, or the source is down: the stored data set stays in place */
  }
}

async function refreshMeta() {
  const btn = $("#refresh-meta");
  btn.disabled = true;
  $("#meta-result").innerHTML =
    '<p class="hint">Fetching events and results. This can take a few minutes; if it fails, the previous data set is left untouched.</p>';
  try {
    const j = await api("/api/limitless?force=1");
    if (!j.entries?.length) throw Error("No archetypes in the response.");
    await commit((n) => {
      n.config.meta = j;
    });
    toast("Metagame data updated.");
  } catch (e) {
    if ($("#meta-result")) $("#meta-result").textContent = "Could not refresh: " + e.message;
    else toast(e.message);
  } finally {
    if ($("#refresh-meta")) $("#refresh-meta").disabled = false;
  }
}
function previewMeta(input) {
  let entries, meta;
  try {
    if (typeof input === "string") {
      const raw = input.trim();
      if (raw.startsWith("{") || raw.startsWith("[")) input = JSON.parse(raw);
      else
        input = {
          entries: raw
            .split(/\r?\n/)
            .filter((s) => s.trim())
            .map((line, i) => {
              const m = line.match(/^\s*(?:\d+[.)]?\s+)?(.+?)\s+(\d+(?:[.,]\d+)?)\s*%\s*$/);
              if (!m)
                throw Error("Could not read line " + (i + 1) + ". Use the format: Name 14.2%.");
              return {
                id: "import-" + m[1].toLowerCase().replace(/[^a-z0-9]+/g, "-"),
                name: m[1],
                share: Number(m[2].replace(",", ".")),
                wr: null,
              };
            }),
        };
    }
    meta = Array.isArray(input) ? { entries: input } : input;
    entries = meta.entries;
    if (!Array.isArray(entries) || !entries.length || entries.length > 500)
      throw Error("No valid entries array.");
    const seen = new Set();
    entries = entries.map((e) => {
      if (
        typeof e.id !== "string" ||
        typeof e.name !== "string" ||
        !Number.isFinite(e.share) ||
        e.share < 0 ||
        e.share > 100 ||
        seen.has(e.id) ||
        (e.wr != null && (!Number.isFinite(e.wr) || e.wr < 0 || e.wr > 100))
      )
        throw Error("Invalid archetype or a duplicate id.");
      seen.add(e.id);
      return { ...e, wr: e.wr ?? null };
    });
    const total = entries.reduce((s, e) => s + e.share, 0);
    if (total > 100.5 || total <= 0)
      throw Error("The shares must add up to between 0 and 100%.");
    const old = state.config.meta.entries;
    let remapped = 0;
    entries = entries.map((e) => {
      const match = old.find((x) => x.name.toLowerCase() === e.name.toLowerCase());
      if (e.id.startsWith("import-") && match) {
        remapped++;
        return { ...e, id: match.id };
      }
      return e;
    });
    modal(
      "Check the metagame set",
      `<p>${entries.length} archetypes, totalling ${total.toFixed(1)}% of field. Matched by name: ${remapped} ids. Overall win rates come only from this import.</p><p class="hint">Your existing matches are kept. Archetypes outside the new set stay in the history with a zero share of the current metagame.</p><div class="form-end"><button class="button" data-action="close">Cancel</button><button class="button primary" id="confirm-meta">Save the set</button></div>`,
    );
    $("#confirm-meta").onclick = () =>
      commit(
        (n) => {
          n.config.meta = {
            ...meta,
            entries,
            asOf: meta.asOf || localDate(),
            source: meta.source || "Manual import",
          };
        },
        { close: true },
      );
  } catch (e) {
    toast(e.message);
  }
}
async function syncAction(push = false) {
  if (pending || busy) {
    toast("Save your local changes first.");
    return;
  }
  busy = true;
  status("Syncing…");
  try {
    const j = await api("/api/sync/" + (push ? "push" : "pull"), {});
    syncInfo = j.sync;
    rememberLauncher(syncInfo.launcher);
    state = migrate(j.state);
    persist();
    status(j.ok ? "Nothing is saved here" : "Sync error", !j.ok);
    render();
    toast(j.ok ? "Sync complete." : syncInfo.error);
    if (j.ok) {
      busy = false;                       // the claim saves on its own
      if (await claimNamedRounds()) render();
    }
  } catch (e) {
    toast(e.message);
    status("Could not sync", true);
  } finally {
    busy = false;
  }
}
/* Text size belongs to the computer, like the theme: the same database is
   read on a laptop at arm's length and on a monitor across a desk. */
function applyTextSize(value) {
  textSize = ["compact", "comfortable", "large"].includes(value) ? value : "comfortable";
  try {
    localStorage.setItem("matchup-lab-text", textSize);
  } catch {}
  document.documentElement.dataset.text = textSize;
}
function applyTheme(value) {
  theme = value;
  try {
    localStorage.setItem("matchup-lab-theme", value);
  } catch {}
  const dark =
    value === "dark" || (value === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $('meta[name="theme-color"]').content = dark ? "#101420" : "#f5f6fa";
}

  return `<div class="card ${polarized ? "" : "hero-card trend-winner"}"><div><span class="badge ${polarized ? "warn" : "purple"}">${esc(label)}</span><h2 style="margin-top:13px">${deckMark(r.id)}${deckLink(r.id, r.name)}</h2><div class="session-summary"><div><strong class="${wrClass(r.expected)}">${pct(r.expected, 1)}</strong><span class="hint">weighted average win rate*</span></div><div><strong>${(r.spread * 100).toFixed(1)} pp</strong><span class="hint">matchup spread*</span></div></div><p class="hint">Basket coverage: ${pct(r.coverage)} · ${r.opponents} rivals · ${r.pairMatches} meetings. Source coverage: ${pct(r.sourceCoverage)}.</p>${r.worst ? `<p class="hint">Hardest: <b>${deckLink(r.worst.id, r.worst.name)}</b> ${wrPct(r.worst.adjusted, 1, r.worst.n >= 10)} (n=${r.worst.n}).<br>Best: <b>${deckLink(r.best.id, r.best.name)}</b> ${wrPct(r.best.adjusted, 1, r.best.n >= 10)} (n=${r.best.n}).</p>` : ""}<button class="button ${polarized ? "small" : "soft"}" data-trend-detail="${esc(r.id)}">Show the matchup spread →</button></div>${polarized ? "" : '<div class="hero-symbol" aria-hidden="true"><div class="mini-cards">◎</div></div>'}</div>`;
}
function renderTrends() {
  const header = title(
    "WHERE THE METAGAME IS MOVING",
    "See where the game is heading.",
    "Compare deck popularity and results. Online and sanctioned events are analysed separately.",
  );
  const controls = trendFilters();
  if (!trendReport)
    return (
      header +
      controls +
      `<div class="card">${empty("No report for the chosen filters", "Click “Fetch analysis”. We will pull data from Limitless or Limitless Labs. Your matches and training statistics stay independent of it.")}</div>` +
      trendMethod()
    );
  const r = trendReport,
    a = r.analysis;
  const current = r.periods.current,
    previous = r.periods.previous;
  const gainers = a.rows
    .filter((x) => x.shareChange >= 0.005 && x.id !== "other")
    .sort((x, y) => y.shareChange - x.shareChange)
    .slice(0, 5);
  const losers = a.rows
    .filter((x) => x.shareChange <= -0.005 && x.id !== "other")
    .sort((x, y) => x.shareChange - y.shareChange)
    .slice(0, 5);
  const maxChange = Math.max(0.01, ...[...gainers, ...losers].map((x) => Math.abs(x.shareChange)));
  const trendList = (rows, gain) =>
    rows.length
      ? rows
          .map(
            (x) =>
              `<div class="list-row"><div class="trend-row-name"><div class="list-name">${esc(x.name)}</div><div class="list-meta">${pct(x.previousShare, 1)} → ${pct(x.share, 1)} of field</div><div class="bar"><i class="${gain ? "good" : "down"}" style="width:${(Math.abs(x.shareChange) / maxChange) * 100}%"></i></div></div><strong class="${gain ? "good-text" : "bad-text"}">${pp(x.shareChange)}</strong></div>`,
          )
          .join("")
      : empty(
          "No change above the threshold",
          "A trend is only labelled at a share change of at least 0.5 percentage points.",
        );
  return (
    header +
    controls +
    `<div class="trend-report-header"><span class="badge purple">${esc(modeLabel(r.params.mode, r.params.division))}</span><span class="hint">${fmtDate(current.from)}–${fmtDate(current.to)} vs ${fmtDate(previous.from)}–${fmtDate(previous.to)} · report from ${prettyTime(r.fetchedAt * 1000)}</span><button class="button link" id="export-trend">Download JSON report ↓</button></div>` +
    `<div class="kpis">${trendMetric("Current period", String(a.currentPlayers), `${r.events.current.length} events · deck entries`)}${trendMetric("Previous period", String(a.previousPlayers), `${r.events.previous.length} events · deck entries`)}${trendMetric("Trending basket", String(a.trending.length), "Popular or clearly gaining decks")}${trendMetric("Decks ranked", String(a.rankedCount), "After the sample and matchup-coverage thresholds")}</div>` +
    `${r.warnings.length ? `<details class="card trend-warnings" open><summary>Sample quality and limits (${r.warnings.length})</summary>${r.warnings.map((w) => `<p class="hint">${esc(w)}</p>`).join("")}</details>` : ""}` +
    `<div class="columns"><div class="card"><div class="card-head"><h2>↗ Gaining share</h2><span class="badge good">FIELD SHARE</span></div>${trendList(gainers, true)}</div><div class="card"><div class="card-head"><h2>↘ Losing share</h2><span class="badge bad">FIELD SHARE</span></div>${trendList(losers, false)}</div></div>` +
    `<div class="trend-section-title"><div class="eyebrow">RESILIENCE TO A CHANGE OF OPPONENT</div><h2>Decks that cover the field best</h2><p class="hint">Two conditions, both absolute: the deck beats the basket on average (${pct(UNIVERSAL_MEAN, 0)} or better) and its results barely move from opponent to opponent (spread of ${(EVEN_SPREAD * 100).toFixed(0)} pp or less). Among those, the three highest universality indexes — the average result less the spread, the hard pairs and any missing coverage. This is not a top three of the metagame: when no deck is both good and even, none is shown, because in a field like that there is nothing to name.</p></div><div class="polarized-grid">${universalTop(a).map((d, i) => trendRankingCard(d, `${i + 1}. UNIVERSALITY INDEX`, true)).join("") || `<div class="card"><p class="hint">No deck in this sample is both above ${pct(UNIVERSAL_MEAN, 0)} against the field and even across it. Either the best decks pay for their results with bad matchups, or the sample is still too small to tell.</p></div>`}</div>${universalTop(a).length && universalTop(a).length < 3 ? '<p class="hint">Fewer than three decks clear both conditions. The list is not padded out.</p>' : ""}` +
    `<div class="trend-section-title"><h2>Decks with the least even matchups</h2><p class="hint">Decks whose results swing by ${(SWINGY_SPREAD * 100).toFixed(0)} pp or more from opponent to opponent — clearly good and clearly bad matchups rather than one steady number. The most polarised, not the weakest: a deck here can have the better average of the two cards. Again absolute, so a quiet metagame simply produces an empty card.</p></div><div class="polarized-grid">${polarizedTop(a).map((d, i) => trendRankingCard(d, `${i + 1}. LARGEST POLARISATION`, true)).join("") || `<div class="card"><p class="hint">No deck in this sample swings by ${(SWINGY_SPREAD * 100).toFixed(0)} pp or more. The field is playing out evenly: which deck you bring matters less than usual, and how you play the mirror matters more.</p></div>`}</div>${polarizedTop(a).length && polarizedTop(a).length < 3 ? '<p class="hint">Fewer than three decks swing that hard. The list is not padded out.</p>' : ""}` +
    `<div class="card"><div class="card-head"><h2>Full trend table</h2><span class="hint">A change in share is not a change in strength</span></div><div class="table-wrap"><table class="matchup-table"><thead><tr><th>Deck</th><th class="num">Share before</th><th class="num">Share now</th><th class="num">Share change</th><th class="num">Round win rate*</th><th class="num">Win rate change*</th><th class="num">Entries now</th></tr></thead><tbody>${a.rows
      .filter((d) => d.share >= 0.005 || d.previousShare >= 0.005)
      .slice(0, trendShowAll ? 500 : 10)
      .map(
        (d) =>
          `<tr><td><div class="table-name">${deckMark(d.id)}${esc(d.name)}</div><div class="table-note">${a.trending.includes(d.id) ? "In the trending basket" : "Outside the ranking basket"}</div></td><td class="num" data-label="Share before">${pct(d.previousShare, 1)}</td><td class="num" data-label="Share now">${pct(d.share, 1)}</td><td class="num ${d.trend === "up" ? "good-text" : d.trend === "down" ? "bad-text" : ""}" data-label="Share change">${pp(d.shareChange)}</td><td class="num" data-label="Round win rate*">${wrPct(d.score, 1)}</td><td class="num" data-label="Score change*">${pp(d.scoreChange)}</td><td class="num" data-label="Entries now">${d.players}</td></tr>`,
      )
      .join(
        "",
      )}</tbody></table></div><button class="button link" id="trend-toggle-all">${trendShowAll ? "Show the 10 most popular" : "Show all decks"} →</button></div>` +
    trendComparison() +
    trendMatrixPointer(a) +
    trendMethod() +
    `<div class="card"><h2>Sources and events</h2><p class="hint">${esc(r.source)} · <a href="${trendLink(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">Open the source ↗</a>. This is an external analysis, not an official statement from the organiser.</p><details><summary>List of events included</summary>${["current", "previous"].map((period) => `<h3 style="margin-top:18px">${period === "current" ? "Current" : "Previous"} period</h3>${r.events[period].map((e) => `<div class="list-row"><div><a href="${trendLink(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.name)}</a><div class="list-meta">${fmtDate(e.date)} · ${e.totalPlayers} entries</div></div></div>`).join("")}`).join("")}</details>${r.errors.length ? `<details><summary>Items not fetched (${r.errors.length})</summary>${r.errors.map((e) => `<p class="hint">${esc(e.event)} ${esc(e.deck || "")} · ${esc(e.message)}</p>`).join("")}</details>` : ""}</div>`
  );
}
function trendMethod() {
  return `<div class="card"><details><summary>How we compute trends, universality and polarisation</summary><div class="method"><p>The report is built from source data and a cache: the online list is held for up to 30 minutes, the Labs list for an hour, and the results of finished events for 7 days. The report time means the analysis was generated, not that every item was fetched again.</p><p><b>Trends:</b> we compare two adjacent periods of the same length, by event start date in UTC. A deck’s share is its number of entries divided by all entries, including those with an unrecognised deck. The same person at two tournaments counts twice. A change of ±0.5 pp triggers the gaining/losing label. This is an observation of a sample, not a significance test or proof of cause.</p><p><b>Round win rate*:</b> (wins + 0.5 × ties) / all decided rounds. Providers may publish other measures, for example tournament points with a tie counted as ⅓ of a win. We do not call this the provider’s official win rate. Online, we exclude byes, double losses, undecided pairs and missing ids. Labs uses the published aggregates.</p><p><b>Trending basket:</b> up to 15 decks with the largest current share that have a share ≥2%, or a share ≥1% and growth ≥0.5 pp. If that rule leaves fewer than 15, the basket is filled up with the next largest shares, never below 1%, so the matrix keeps its shape; those extra decks meet fewer opponents and their pairs are marked small more often. Variants with different ids are not merged. Mirrors do not affect the universality ranking.</p><p><b>Small-sample protection:</b> each pair needs the chosen minimum of 10/20/30 meetings. For the ranking we require at least 3 such rivals, 50 meetings with them in total, 10 entries for the deck, 70% coverage of the basket rivals’ share, and source matchups representing ≥80% of that deck’s entries. A pair’s result is smoothed with ten neutral observations: (W + 0.5T + 5)/(N + 10). A missing pair stays missing.</p><p><b>Universality (top three):</b> index = average win rate weighted by rival share − 0.75 × weighted standard deviation − 0.20 × share of hard pairs (smoothed result &lt;40%) − 0.10 × missing basket coverage. The weights are an explicit training heuristic. Low variance alone is not enough: a deck that is weak against everything is not automatically universal.</p><p><b>The three least even decks:</b> qualifying decks sorted by the weighted standard deviation of their pair results, descending. We also show the best and the hardest pair. This is not a ranking of the three weakest decks.</p><p>Online and sanctioned events have separate reports. We do not treat any offline event as sanctioned: this view uses only finished Regionals, Internationals, Worlds and Special Events in Limitless Labs, in the age division chosen above. <b>All divisions</b> is not a division the provider publishes: Masters, Seniors and Juniors are fetched separately and added together, which is what makes the figures comparable with the online ladder, where no age is published at all. The three fields differ in size, Masters by far the largest. Differences in format and card legality between periods can affect comparability.</p></div></details></div>`;
}
function trendComparison() {
  const r = trendReport,
    other = otherTrendReport;
  if (!other)
    return `<div class="card"><h2>Online versus sanctioned events</h2><p class="hint">There is no second-source report for identical filters. Switch the event type and fetch the analysis to compare trends. We do not mix the results of the two environments.</p></div>`;
  const one = r.params.mode === "online" ? r : other,
    two = r.params.mode === "sanctioned" ? r : other;
  const ids = [...new Set([...one.analysis.trending, ...two.analysis.trending])];
  return `<div class="card"><h2>Online versus sanctioned events</h2><p class="hint">The same periods and filters, two independent samples. Online report: ${prettyTime(one.fetchedAt * 1000)} · sanctioned: ${prettyTime(two.fetchedAt * 1000)}.</p><div class="table-wrap"><table class="matchup-table"><thead><tr><th>Deck</th><th class="num">Online · share change</th><th class="num">Sanctioned · share change</th></tr></thead><tbody>${ids
    .map((id) => {
      const a = one.analysis.rows.find((d) => d.id === id),
        b = two.analysis.rows.find((d) => d.id === id);
      return `<tr><td>${deckMark(id)}${deckLink(id, a?.name || b?.name || id)}</td><td class="num" data-label="Online">${pp(a?.shareChange ?? null)}</td><td class="num" data-label="Sanctioned">${pp(b?.shareChange ?? null)}</td></tr>`;
    })
    .join("")}</tbody></table></div></div>`;
}
/* The order of the matrix is the whole argument of the table. By popularity
   it answers "what will I meet"; by strength it answers "who is actually
   beating whom", and the same order down the side and across the top keeps
   the diagonal a mirror - so a block of green in the top right and red in
   the bottom left is a real pecking order, and anything that breaks the
   pattern is a cycle worth noticing. */
let matrixOrder = "strength";
/* How even a deck's matchups are. Absolute values, not a ranking: in a flat
   metagame the widest three spreads can all be narrow, and a deck should not
   be called polarised for coming third in a field where nobody is. Matches
   EVEN_SPREAD / SWINGY_SPREAD on the server. */
const EVEN_SPREAD = 0.08;
const SWINGY_SPREAD = 0.13;
const UNIVERSAL_MEAN = 0.5;
function shapeOf(spread) {
  if (spread == null) return "";
  return spread <= EVEN_SPREAD ? "even" : spread >= SWINGY_SPREAD ? "swingy" : "";
}
const MATRIX_ORDERS = { strength: "By strength", share: "By field share", mine: "By my results" };

function matrixRank(a) {
  const rated = (a.evaluated || []).filter((r) => r.eligible && r.universalScore != null);
  const order = [...rated].sort((x, y) => y.universalScore - x.universalScore);
  const map = new Map();
  order.forEach((r, i) =>
    map.set(r.id, {
      rank: i + 1,
      expected: r.expected,
      spread: r.spread,
      shape: shapeOf(r.spread),
    }),
  );
  return map;
}

/* My own record against each archetype, across every deck - the matrix is
   about the field, not about one list. */
function myRecordByOpponent() {
  const out = new Map();
  // `state` is the app's own global; a `let` at the top level of app.js is
  // visible to every script on the page, but not as a property of window
  for (const m of ((typeof state === "object" && state?.matches) || []).filter((x) => !x.demo)) {
    const held = out.get(m.opp) || { w: 0, l: 0, t: 0, n: 0 };
    held.n++;
    if (m.result === "W") held.w++;
    else if (m.result === "L") held.l++;
    else held.t++;
    out.set(m.opp, held);
  }
  return out;
}

function orderedDecks(a) {
  const decks = a.trending.map((id) => a.rows.find((r) => r.id === id)).filter(Boolean);
  if (matrixOrder === "share") return decks;        // the report already sorts by share
  if (matrixOrder === "mine") {
    const mine = myRecordByOpponent();
    const score = (d) => {
      const r = mine.get(d.id);
      return r && r.n ? (r.w + 0.5 * r.t) / r.n : -1;   // never played goes last
    };
    return [...decks].sort((x, y) => score(y) - score(x));
  }
  const rank = matrixRank(a);
  return [...decks].sort((x, y) => {
    const rx = rank.get(x.id)?.rank ?? 999, ry = rank.get(y.id)?.rank ?? 999;
    return rx - ry;                                   // unrated decks keep their share order
  });
}

function matrixTable(a, minPair) {
  const decks = orderedDecks(a);
  const rank = matrixRank(a);
  const mine = myRecordByOpponent();
  const label = (d) => {
    if (matrixOrder === "mine") {
      const r = mine.get(d.id);
      return r && r.n
        ? `<span class="matrix-rank">${r.w}–${r.l}–${r.t}</span>`
        : '<span class="matrix-rank muted">no rounds</span>';
    }
    const k = rank.get(d.id);
    if (!k) return '<span class="matrix-rank muted">not rated</span>';
    // one line, so every row header is exactly as tall as every other
    return (
      `<span class="matrix-rank">#${k.rank} · ${pct(k.expected, 0)}` +
      (k.shape ? ` <i class="shape ${k.shape}">${k.shape}</i>` : "") +
      "</span>"
    );
  };
  const head = decks
    .map((d) => `<th><span class="matrix-head" title="${esc(d.name)}">${deckMark(d.id)}<span>${esc(d.name)}</span></span></th>`)
    .join("");
  const body = decks
    .map(
      (d) =>
        `<tr><th><span class="matrix-head" title="${esc(d.name)}">${deckMark(d.id)}<span>${esc(d.name)}</span>${label(d)}</span></th>${decks
          .map((o) => {
            if (d.id === o.id) return '<td class="matrix-mirror">mirror</td>';
            const p = a.matrix[d.id]?.[o.id];
            if (!p) return '<td class="matrix-none">—</td>';
            const n = p.wins + p.losses + p.ties,
              wr = n ? (p.wins + 0.5 * p.ties) / n : null;
            const thin = n < (minPair || 10);
            return `<td class="${thin ? "matrix-thin" : wr < 0.4 ? "matrix-bad" : wr > 0.6 ? "matrix-good" : ""}"><b>${pct(wr, 0)}</b><small>${n}${thin ? "·small" : ""}</small></td>`;
          })
          .join("")}</tr>`,
    )
    .join("");
  return `<div class="table-wrap matrix-wrap"><table class="matrix"><thead><tr><th>Deck</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
/* The matrix is square, so it grows with the square of the basket: fifteen
   decks is 225 cells and no window is that wide. The names are therefore set
   under their icons in narrow columns, the first column and the header stay
   put while the rest scrolls, and a button throws the whole thing onto the
   full window when reading beats glancing. */
function onScreenReport() {
  return page === "matchups" ? matrixReport : trendReport;
}
function minPairOf(r) {
  return (r && r.params && r.params.minPair) || trendParams.minPair || 10;
}
window.matrixFullHtml = function () {
  const a = onScreenReport()?.analysis;
  return a ? matrixTable(a, minPairOf(onScreenReport())) : "<p class=\"hint\">No report loaded.</p>";
};
function trendMatrixPointer(a) {
  const decks = a.trending.length;
  return `<div class="card"><h2>Matrix of real matchups</h2><p class="hint">The ${decks}-deck matrix of who beats whom now lives on the <b>Matchups</b> page, beside your own record, and is there as soon as that page opens. It is drawn from the most recent report this computer holds, which may not be the one on screen here.</p><div class="actions"><button class="button soft" data-action="matchups">Open Matchups →</button></div></div>`;
}

/* ---- the matrix on the Matchups page ---------------------------------- */

function matrixSourceLine(r) {
  const p = r.params || {};
  const when = r.fetchedAt ? prettyTime(r.fetchedAt * 1000) : "an unknown time";
  const period = r.periods?.current
    ? `${fmtDate(r.periods.current.from)} – ${fmtDate(r.periods.current.to)}`
    : "an unstated period";
  return `${esc(modeLabel(p.mode, p.division))} · ${esc(period)} · built ${esc(when)} · ` +
    `pairs under ${p.minPair || 10} meetings greyed`;
}

/* What the chosen order actually does, said where the choice is made. Both
   sides of the matrix are always ordered the same way, so the diagonal stays
   the mirror. */
function orderNote() {
  if (matrixOrder === "share")
    return "Ordered by how much of the field each deck is: what you are most likely to " +
      "meet comes first, down the side and across the top alike.";
  if (matrixOrder === "mine") {
    const mine = myRecordByOpponent();
    const basket = matrixReport?.analysis?.trending || [];
    const played = basket.filter(function (id) { return (mine.get(id) || {}).n; }).length;
    const lead = "Ordered by your own record against each deck — wins first, decks you have " +
      "never played last — counting rounds from every deck of yours, since this is about " +
      "the opponent, not your list. Your W–L–T replaces the ranking beside each name.";
    return played
      ? lead + " You have rounds against " + played + " of the " + basket.length + " decks here."
      : lead + " Nothing is recorded against any of these decks yet, so the order below is " +
        "the one it started in — this becomes useful once there are rounds in the app.";
  }
  return "Ordered by expected result against the whole field, so the best matchups collect " +
    "in the top right and the hardest in the bottom left. The number beside each name is " +
    "that deck’s place in the field.";
}

window.matchupsMatrixCard = function () {
  if (!matrixReport || !matrixReport.analysis)
    return `<div class="card"><h2>Matrix of real matchups</h2><p class="hint">${
      matrixLoading
        ? "Reading the most recent report on this computer…"
        : "No report on this computer yet. Open Trends and press “Fetch analysis” once; " +
          "after that the matrix is here every time, without waiting."
    }</p></div>`;
  const a = matrixReport.analysis;
  const decks = a.trending.length;
  return `<div class="card"><details${matrixOpen === false ? "" : " open"} id="matrix-details"><summary>Matrix of real matchups (${decks} decks)</summary><p class="hint matrix-source">${matrixSourceLine(matrixReport)}${
    matrixNote ? " · " + esc(matrixNote)
      : matrixRefreshing ? " · fetching a newer one in the background…" : ""
  }</p><div class="matrix-head-row"><p class="hint">The row plays against the column: round win rate, and underneath it the number of meetings. Grey means too few meetings to trust; a blank cell means the two never met and nothing is guessed in its place.</p><div class="matrix-controls"><div class="segmented" role="group" aria-label="Order of the matrix">${Object.entries(MATRIX_ORDERS).map(([k, v]) => `<button data-matrix-order="${k}" aria-pressed="${matrixOrder === k}" class="${matrixOrder === k ? "on" : ""}">${esc(v)}</button>`).join("")}</div><button class="button small" data-action="matrix-full">Open full window ⤢</button><button class="button small" data-action="matrix-refresh"${matrixRefreshing ? " disabled" : ""}>↻ Refresh</button></div></div><p class="hint matrix-order-note">${orderNote()}</p>${matrixTable(a, minPairOf(matrixReport))}</details></div>`;
};

/* Reads what is already on this computer. Fetches nothing, says nothing if
   it fails: the page simply shows no matrix rather than an error about a
   report the person never asked for. */
window.loadMatrixReport = async function () {
  if (matrixLoading || !connected) return;
  matrixReadAt = Date.now();
  matrixLoading = true;
  try {
    const got = await api("/api/trends/latest");
    matrixReport = got.report || null;
  } catch (e) {
    matrixReport = matrixReport || null;
  } finally {
    matrixLoading = false;
  }
  if (page === "matchups") render();
  freshenMatrix();
};

/* Building a newer report and swapping the matrix in when it arrives. Quiet
   mode is the automatic daily top-up: it says nothing and, if the build
   fails, leaves the matrix exactly as it was. Loud mode is the Refresh
   button, which reports what happened because somebody is waiting for it. */
async function buildMatrix(want, loud) {
  if (matrixRefreshing) return;
  matrixRefreshing = true;
  matrixNote = loud ? "fetching a newer report from Limitless…" : "";
  if (page === "matchups") render();
  try {
    try {
      await api("/api/trends/refresh", want);
    } catch (e) {
      /* Trends may already be building one. That report is the newest there
         will be, so wait for it rather than complain about it. */
      if (!/already being fetched/i.test(e.message || "")) throw e;
    }
    for (let i = 0; i < 300; i++) {
      await new Promise((done) => setTimeout(done, 2000));
      const j = await api("/api/trends/job");
      if (j.job && j.job.status === "running") {
        if (loud) {
          matrixNote = "fetching from Limitless… " +
            (j.job.total ? j.job.done + "/" + j.job.total : j.job.message || "");
          if (page === "matchups") render();
        }
        continue;
      }
      if (j.job && j.job.status === "done") {
