    <style>
:root {
  --bg: #f5f6fa;
  --surface: #fff;
  --surface2: #f0f2f8;
  --ink: #20243c;
  --muted: #656d85;
  --line: #e5e7f0;
  --accent: #6951e8;
  --accent2: #eeebff;
  --good: #117a58;
  --good-bg: #e8f6ef;
  --bad: #bd3d56;
  --bad-bg: #fceef1;
  --warn: #916116;
  --warn-bg: #fff5de;
  --sidebar: #171b32;
  --shadow: 0 8px 35px #20243c05;
  /* One grid for the whole app: every panel sits on these tracks and shares
     this gutter, so a row of four tiles lines up with a row of two and the
     page keeps its shape at any window width. */
  --gap: 18px;
  --cols-4: repeat(4, minmax(0, 1fr));
  --cols-3: repeat(3, minmax(0, 1fr));
  --cols-2: repeat(2, minmax(0, 1fr));
  --content: 1408px;
  /* One knob for the whole type scale. Every font-size is a multiple of it,
     so a large screen can simply be told to speak up - and so can a person
     who would rather not reach for their glasses. --fs-base follows the
     window, --fs-scale follows the setting in Appearance, and everything in
     the app is sized from their product. */
  --fs-base: 1px;
  --fs-scale: 1.15;
  --fs: calc(var(--fs-base) * var(--fs-scale));
  /* a heading needs a little more air than the blocks below it */
  --title-gap: 26px;
  color-scheme: light;
  font-family: "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #101420;
  --surface: #191f30;
  --surface2: #222a3e;
  --ink: #edf0fa;
  --muted: #a4afc9;
  --line: #303a51;
  --accent: #b3a4ff;
  --accent2: #302b4f;
  --good: #77d8b0;
  --good-bg: #173b32;
  --bad: #ff9eb1;
  --bad-bg: #422632;
  --warn: #edcd85;
  --warn-bg: #3d3421;
  --sidebar: #0c101c;
  --shadow: none;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: calc(14 * var(--fs));
  line-height: 1.55;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
a {
  color: var(--accent);
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 232px;
  background: var(--sidebar);
  color: #e9ebf7;
  padding: 36px 22px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: inherit;
  text-decoration: none;
  font-size: calc(14 * var(--fs));
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: 2px;
}
.brand img {
  border-radius: 12px;
}
.brand-lab {
  display: block;
  font-size: calc(29 * var(--fs));
  letter-spacing: 1.5px;
  margin-top: 3px;
}
.brand-dot {
  color: #b7a7ff;
}
.sidebar-caption {
  font-size: calc(9 * var(--fs));
  letter-spacing: 1.8px;
  color: #9da6c5;
  margin: 32px 0 20px;
}
nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
nav button {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  border-radius: 10px;
  padding: 13px 14px;
  background: transparent;
  color: #aeb6d1;
  text-align: left;
  font-weight: 600;
}
nav button span {
  font-size: calc(20 * var(--fs));
  width: 24px;
  text-align: center;
  line-height: 1;
}
nav button:hover {
  background: #ffffff08;
  color: white;
}
nav button.active {
  background: #7461dd35;
  color: #e2dfff;
}
nav button b {
  font-size: calc(11 * var(--fs));
  font-weight: 500;
  margin-left: auto;
  background: #ffffff0c;
  padding: 1px 6px;
  border-radius: 5px;
}
.sidebar-bottom {
  margin-top: auto;
  border-top: 1px solid #ffffff14;
  padding-top: 24px;
}
.tiny-label {
  font-size: calc(9 * var(--fs));
  letter-spacing: 1.6px;
  font-weight: 700;
}
.sidebar-bottom p {
  font-size: calc(12 * var(--fs));
  line-height: 1.7;
  color: #aeb6d1;
}
.build {
  font-size: calc(9 * var(--fs));
  color: #8993b4;
  letter-spacing: 0.7px;
}
.app-shell {
  margin-left: 232px;
}
.topbar {
  min-height: 82px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  /* The bar spans the window so its underline does, but its contents sit on
     the same column as the cards below — on a wide monitor the deck picker
     would otherwise drift off to the far right, away from everything else. */
  padding: 16px max(36px, calc((100% - var(--content)) / 2));
  position: sticky;
  top: 0;
  z-index: 20;
}
.top-context {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: calc(12 * var(--fs));
}
.status-dot {
  width: 7px;
  height: 7px;
  background: var(--good);
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.error {
  background: var(--bad);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.top-actions select {
  max-width: 220px;
}
main {
  max-width: 1480px;
  margin: auto;
  padding: 34px 36px 20px;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  font-size: calc(29 * var(--fs));
  letter-spacing: -1px;
  line-height: 1.2;
  margin-bottom: 9px;
}
h2 {
  font-size: calc(17 * var(--fs));
  letter-spacing: -0.3px;
  margin-bottom: 5px;
}
h3 {
  font-size: calc(14 * var(--fs));
  margin-bottom: 8px;
}
.eyebrow {
  font-size: calc(10 * var(--fs));
  letter-spacing: 1.8px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 11px;
}
.intro {
  color: var(--muted);
  margin-bottom: 0;
  max-width: 750px;
}
/* Every block on a page is separated by the same distance as the columns
   inside it. Each component used to bring its own margin - 26, 22, 20, and
   in two places nothing at all, so the cards touched. */
main > section > * {
  margin-bottom: var(--gap);
}
main > section > *:last-child {
  margin-bottom: 0;
}
main > section > * + * {
  margin-top: 0;
}
.page-title {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  margin-bottom: var(--title-gap);
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-head {
  display: flex;
  justify-content: space-between;
  /* the control belongs beside the heading, not halfway down the paragraph
     that follows it */
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 20px;
}
.card-head > div:first-child { min-width: 0; }
/* a single control next to a heading still reads better centred on it */
.card-head > .button, .card-head > .segmented { margin-top: -2px; }
.card-head h2 {
  margin: 0;
}
.hint {
  font-size: calc(12 * var(--fs));
  color: var(--muted);
  line-height: 1.65;
}
.muted {
  color: var(--muted);
}
.kpis {
  display: grid;
  grid-template-columns: var(--cols-4);
  gap: var(--gap);
}
.kpi {
  padding: 21px;
}
.kpi label {
  font-size: calc(12 * var(--fs));
  font-weight: 600;
  color: var(--muted);
}
.kpi strong {
  display: block;
  font-size: calc(30 * var(--fs));
  letter-spacing: -1.2px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin: 8px 0 3px;
}
.kpi p {
  font-size: calc(11 * var(--fs));
  color: var(--muted);
  margin: 0;
}
.kpi.hero {
  border-color: #b6a9f3;
  background: linear-gradient(125deg, var(--accent2), var(--surface));
}
.hero-card {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(200px, 0.8fr);
  gap: 28px;
  border-color: #c3b8f4;
  background: linear-gradient(120deg, var(--accent2), var(--surface) 75%);
}
.hero-card h2 {
  font-size: calc(25 * var(--fs));
  letter-spacing: -0.8px;
  margin: 12px 0;
}
.hero-card p {
  color: var(--muted);
  max-width: 550px;
}
.hero-symbol {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 160px;
  background: radial-gradient(ellipse, #9c8cec20, transparent 65%);
}
.mini-cards {
  position: relative;
  width: 120px;
  height: 145px;
  transform: rotate(12deg);
  border: 2px solid #b8a9ee;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--surface), var(--accent2));
  box-shadow:
    -18px 15px 0 -3px var(--surface),
    -18px 15px 0 -1px #b8a9ee;
  display: grid;
  place-items: center;
  color: var(--accent);
  font-size: calc(46 * var(--fs));
}
.columns {
  display: grid;
  grid-template-columns: var(--cols-2);
  gap: var(--gap);
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.button {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 15px;
  background: var(--surface);
  color: var(--ink);
  font-size: calc(12 * var(--fs));
  font-weight: 600;
  display: inline-flex;
  gap: 7px;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  min-height: 40px;
}
.button:hover {
  border-color: var(--accent);
}
.button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
:root[data-theme="dark"] .button.primary {
  color: #151124;
}
.button.soft {
  background: var(--accent2);
  border-color: transparent;
  color: var(--accent);
}
.button.danger {
  color: var(--bad);
}
.button.small {
  font-size: calc(11 * var(--fs));
  padding: 6px 10px;
  min-height: 34px;
}
.button.link {
  border: 0;
  background: transparent;
  color: var(--accent);
  padding: 4px;
}
.icon-button {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 9px;
  width: 40px;
  height: 40px;
  font-size: calc(19 * var(--fs));
  display: grid;
  place-items: center;
}
.actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 6px;
  background: var(--surface2);
  color: var(--muted);
  padding: 3px 8px;
  font-size: calc(10 * var(--fs));
  font-weight: 600;
}
.badge.good {
  background: var(--good-bg);
  color: var(--good);
}
.badge.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.badge.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.badge.purple {
  background: var(--accent2);
  color: var(--accent);
}
.record {
  font-variant-numeric: tabular-nums;
}
.good-text {
  color: var(--good);
}
.bad-text {
  color: var(--bad);
}
.warn-text {
  color: var(--warn);
}
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.list-row:last-child {
  border: 0;
  padding-bottom: 0;
}
.list-row:first-child {
  padding-top: 0;
}
.list-name {
  font-size: calc(13 * var(--fs));
  font-weight: 600;
  overflow-wrap: anywhere;
}
.list-meta {
  font-size: calc(11 * var(--fs));
  color: var(--muted);
  margin-top: 4px;
  overflow-wrap: anywhere;
}
/* A flex line wraps before it shrinks, so a long note written under a match
   used to shove the whole name block onto its own row, leaving the W/L badge
   stranded above it. The text column shrinks instead; the badge and the
   buttons keep their size. */
.list-row > .actions:not(.list-actions) {
  flex-wrap: nowrap;
  min-width: 0;
  flex: 1 1 auto;
}
.list-row > .actions:not(.list-actions) > *:not(.result) {
  min-width: 0;
}
.list-row > .list-actions {
  flex-shrink: 0;
}
.result {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: calc(12 * var(--fs));
  font-weight: 800;
  flex-shrink: 0;
}
.result.W {
  color: var(--good);
  background: var(--good-bg);
}
.result.L {
  color: var(--bad);
  background: var(--bad-bg);
}
.result.T {
  color: var(--muted);
  background: var(--surface2);
}
.bar {
  height: 6px;
  background: var(--surface2);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 7px;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 5px;
}
.bar i.good {
  background: var(--good);
}
.empty {
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
}
.empty strong {
  display: block;
  color: var(--ink);
  font-size: calc(16 * var(--fs));
  margin-bottom: 8px;
}
.empty p {
  font-size: calc(12 * var(--fs));
  max-width: 410px;
  margin: 0 auto 17px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 20px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.field label,
.field-label {
  font-size: calc(11 * var(--fs));
  font-weight: 600;
  color: var(--muted);
}
.field.grow {
  flex: 1;
  min-width: 160px;
}
input,
select,
textarea {
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  min-height: 40px;
  max-width: 100%;
}
textarea {
  width: 100%;
  resize: vertical;
  font-family: ui-monospace, monospace;
  font-size: calc(12 * var(--fs));
}
.table-wrap {
  overflow: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: calc(12 * var(--fs));
}
th {
  text-align: left;
  font-weight: 600;
  font-size: calc(10 * var(--fs));
  color: var(--muted);
  padding: 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--line);
}
tbody tr:last-child td {
  border: 0;
}
th.num,
td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.table-name {
  font-weight: 600;
}
.table-note {
  font-size: calc(10 * var(--fs));
  color: var(--muted);
  margin-top: 4px;
}
.deck-grid {
  display: grid;
  grid-template-columns: var(--cols-3);
  gap: var(--gap);
}
.deck-card {
  position: relative;
  overflow: hidden;
}
.deck-cover {
  height: 78px;
  border-radius: 10px;
  background: linear-gradient(120deg, var(--accent2), var(--surface2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  color: var(--accent);
  font-size: calc(34 * var(--fs));
  margin-bottom: 18px;
}
.deck-cover .badge {
  font-size: calc(10 * var(--fs));
}
.deck-card h2 {
  font-size: calc(19 * var(--fs));
  margin-bottom: 7px;
}
.deck-card .actions {
  margin-top: 18px;
}
.compact-grid {
  display: grid;
  grid-template-columns: var(--cols-3);
  gap: var(--gap);
}
.drill-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.drill-card p {
  flex: 1;
}
.drill-icon {
  height: 50px;
  width: 50px;
  background: var(--accent2);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: calc(26 * var(--fs));
  border-radius: 13px;
}
.drill-card .button {
  align-self: flex-start;
}
.answer-panel {
  margin-top: 20px;
  padding: 20px;
  background: var(--surface2);
  border-radius: 12px;
}
.feedback {
  margin-top: 18px;
  padding: 15px;
  border-radius: 10px;
  background: var(--surface2);
}
.feedback.good {
  background: var(--good-bg);
  color: var(--good);
}
.feedback.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.feedback p {
  margin-bottom: 0;
}
.card-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 7px;
  margin: 16px 0;
}
.card-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: calc(11 * var(--fs));
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
}
.card-choice {
  font-size: calc(11 * var(--fs));
  text-align: left;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  min-height: 40px;
}
.picks {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}
.picks button {
  border: 0;
  border-radius: 7px;
  padding: 7px 9px;
  background: var(--accent2);
  color: var(--accent);
  font-size: calc(11 * var(--fs));
}
.clock {
  font-size: calc(25 * var(--fs));
  font-variant-numeric: tabular-nums;
}
.settings-grid {
  display: grid;
  grid-template-columns: var(--cols-2);
  gap: var(--gap);
}
.settings-grid > .wide {
  grid-column: 1/-1;
}
details {
  margin-top: 15px;
}
summary {
  font-size: calc(12 * var(--fs));
  font-weight: 600;
  cursor: pointer;
  color: var(--accent);
}
.demo-notice,
#notice {
  padding: 13px 18px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: calc(12 * var(--fs));
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.demo-notice {
  background: var(--warn-bg);
  color: var(--warn);
}
#notice {
  background: var(--bad-bg);
  color: var(--bad);
}
footer {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: space-between;
  margin-top: 35px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: calc(10 * var(--fs));
}
dialog {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  color: var(--ink);
  padding: 0;
  max-width: 760px;
  width: calc(100% - 32px);
  max-height: 90dvh;
  box-shadow: 0 25px 100px #0003;
}
dialog::backdrop {
  background: #11152b80;
  backdrop-filter: blur(3px);
}
.dialog-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
  font-weight: 700;
  font-size: calc(17 * var(--fs));
}
#dialog-content {
  padding: 24px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-grid .full {
  grid-column: 1/-1;
}
.game-entry {
  padding: 15px;
  background: var(--surface2);
  border-radius: 10px;
  margin: 10px 0;
  display: grid;
  grid-template-columns: 60px 1fr 1fr;
  gap: 10px;
  align-items: center;
}
.game-entry .reason-field,
/* the note runs the width of the row like the reason above it; without this
   it drops into the 60px label column and comes out one word wide */
.game-entry .full {
  grid-column: 2/-1;
}
.game-entry strong {
  font-size: calc(12 * var(--fs));
}
.form-end {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}
.error-text {
  color: var(--bad);
  font-size: calc(12 * var(--fs));
}
.import-preview {
  padding: 16px;
  background: var(--surface2);
  border-radius: 10px;
  margin: 15px 0;
}
#toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--surface);
  padding: 12px 20px;
  border-radius: 10px;
  z-index: 100;
  box-shadow: 0 6px 35px #0002;
  max-width: 90vw;
  font-size: calc(12 * var(--fs));
}
.method {
  font-size: calc(12 * var(--fs));
  line-height: 1.7;
  color: var(--muted);
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  font-size: calc(12 * var(--fs));
}
.saved-scenario {
  white-space: pre-wrap;
  max-height: 220px;
  overflow: auto;
  background: var(--surface2);
  padding: 12px;
  border-radius: 8px;
  font-size: calc(11 * var(--fs));
}
.session-summary {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.session-summary strong {
  font-size: calc(24 * var(--fs));
  display: block;
}
.checkline {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: calc(12 * var(--fs));
  color: var(--muted);
}
.checkline input {
  min-height: auto;
}
.sample-button {
  margin-top: 15px;
}
.version-history {
  border-left: 2px solid var(--line);
  padding-left: 15px;
}
.segmented {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;          /* beside a paragraph, keep the control's own width */
}
.segmented button {
  border: 1px solid var(--line);
  padding: 8px 13px;
  background: var(--surface);
  color: var(--muted);
  border-radius: 8px;
  white-space: nowrap;     /* "Whole field" on one line, not stacked as two */
}
/* the chosen one, however the page marks it */
.segmented button[aria-pressed="true"], .segmented button.on {
  background: var(--accent2);
  color: var(--accent);
  border-color: var(--accent);
}

    /* a hint of the next destination, so it is clear the bar slides */
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 18px), transparent 100%);
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 18px), transparent 100%);
  }
  .brand {
    display: none;

  .kpi {

@media (max-width: 600px) {
  /* Was: min-width 0 and flex 1, which squeezed the nine destinations down
     to 40px each. The bar scrolls instead - see the rule further up. */
  /* Three nowrap buttons will not fit side by side on the narrowest phones,
     and flex-shrink 0 kept them from giving way - the page slid sideways
     instead. Here they are allowed to wrap onto a second line. */
  .segmented {

/* ---- reading measure ----------------------------------------------------
   Prose stops at a comfortable line length instead of stretching to the full
   width of a wide monitor; tables, matrices, charts and card grids keep every
   pixel, because those genuinely read better wide. Measured in ch, so the cap
   follows the font size rather than a fixed pixel guess. */
/* Descriptions fill the card they sit in. An earlier version capped them at a
   78-character measure, which left most of a wide card empty. */
.card > p,
.card > .hint,
.card-head + .hint,
.card > details > .hint,
.method p,
.method,
.trend-section-title p,
.empty p,
.import-preview p,
.intro,
noscript {
  max-width: none;
}

/* ---- scan sheet review ------------------------------------------------- */
.scan-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0 6px; }
.scan-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scan-table { width: 100%; border-collapse: collapse; font-size: calc(14 * var(--fs)); min-width: 620px; }
.scan-table th { text-align: left; font-size: calc(11 * var(--fs)); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.scan-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scan-table select { width: 100%; min-width: 64px; }
.scan-table td select + select { margin-top: 4px; }
.scan-table .hint { max-width: 16ch; }
.scan-use { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.scan-warn td { background: color-mix(in srgb, var(--warn, #c98a00) 9%, transparent); }
@media (max-width: 720px) { .scan-table { font-size: calc(13 * var(--fs)); } }

/* ---- a checkbox with its own explanation ------------------------------- */
.check { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; cursor: pointer; }
.check input { margin-top: 3px; flex: 0 0 auto; }
.check span { font-size: calc(14 * var(--fs)); }
.check em { display: block; font-style: normal; color: var(--muted); font-size: calc(13 * var(--fs));
  margin-top: 3px; max-width: 72ch; }

/* ---- win-rate bands in the matchup spread ------------------------------ */
.wr { display: inline-block; padding: 1px 7px; border-radius: 6px;
  font-variant-numeric: tabular-nums; }
.wr-good { color: var(--good); background: var(--good-bg); }
.wr-mid  { color: var(--warn); background: var(--warn-bg); }
.wr-bad  { color: var(--bad);  background: var(--bad-bg); }
.wr-thin { opacity: .55; }
.wr-key { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin: 10px 0 14px; font-size: calc(13 * var(--fs)); }
.wr-key .wr { font-weight: 600; font-size: calc(12 * var(--fs)); }
.wr-key .hint { max-width: none; }

/* ---- deck name links out to Limitless ---------------------------------- */
.deck-link { color: inherit; text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, currentColor 32%, transparent); }
.deck-link:hover, .deck-link:focus-visible {
  border-bottom-color: currentColor; color: var(--accent, inherit); }
.deck-link .ext { font-size: .72em; margin-left: .28em; opacity: .55;
  vertical-align: .22em; border: 0; }
.deck-link:hover .ext { opacity: 1; }
h2 .deck-link { border-bottom-width: 2px; }

/* the win-rate bands also work on a badge, which brings its own colours */
.badge.wr-good { color: var(--good); background: var(--good-bg); }
.badge.wr-mid  { color: var(--warn); background: var(--warn-bg); }
.badge.wr-bad  { color: var(--bad);  background: var(--bad-bg); }
/* on a big KPI figure the chip would shout; keep the colour, drop the fill */
.kpi strong.wr { background: none; padding: 0; }
/* A filled chip beside another filled chip turns a table row into a row of
   boxes, and the eye stops reading numbers. Inside a table the colour and the
   weight carry the meaning on their own. The matrix is the exception: there
   the fill of the cell IS the picture, 225 of them at a glance. */
table:not(.matrix) .wr { background: none; padding: 0; font-weight: 700; }

/* ---- running totals, one line above everything ------------------------- */
.totals-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 18px;
  box-shadow: var(--shadow);
}
.totals-bar .total {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 2px 20px;
}
.totals-bar .total:first-child {
  padding-left: 0;
}
.totals-bar .total + .total {
  border-left: 1px solid var(--line);
}
.totals-bar strong {
  font-size: calc(17 * var(--fs));
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
}
.totals-bar span {
  font-size: calc(11 * var(--fs));
  color: var(--muted);
}
.totals-bar .since {
  margin-left: auto;
}
.totals-bar .since strong {
  font-size: calc(13 * var(--fs));
  font-weight: 600;
  color: var(--muted);
}
/* Once the line wraps, the dividers start a row with a stray rule and an
   indent, so below that width the figures simply sit in a grid. */
@media (max-width: 1150px) {
  .totals-bar {
    gap: 6px 22px;
  }
  .totals-bar .total,
  .totals-bar .total:first-child {
    padding: 2px 0;
  }
  .totals-bar .total + .total {
    border-left: 0;
  }
  .totals-bar .since {
    margin-left: 0;
  }
}

/* ---- whose database is open -------------------------------------------- */
.player-chip {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 13px 0 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: calc(13 * var(--fs));
  font-weight: 600;
  cursor: pointer;
}
.player-chip.viewing {
  border-style: dashed;
  border-color: var(--player, var(--muted));
  background: var(--surface2);
}
.player-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--player, var(--accent));
  flex: 0 0 11px;
}
.player-tag {
  font-size: calc(10 * var(--fs));
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--player, var(--muted));
}
.player-caret { color: var(--muted); font-size: calc(11 * var(--fs)); }
#player-strip {
  border-bottom: 1px solid var(--line);
  padding: 11px max(36px, calc((100% - var(--content)) / 2));
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: calc(12.5 * var(--fs));
  background: var(--surface2);
}
#player-strip .grow { flex-grow: 1; }
#player-strip .muted { color: var(--muted); }
.player-line { height: 3px; background: var(--player, var(--accent)); }
.player-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.player-row:last-of-type { border-bottom: 0; }

/* Viewing someone else's database. Only the controls that would create or
   destroy something are gone - adding, deleting, renaming, importing. Reading
   the details of a match, switching deck, fetching a list to look at: all of
   that stays, because looking around is the whole point of this mode. What
   you change is held on screen and never written; the bar at the top says so
   and offers a reload. */
body.viewer [data-edit],
body.viewing [data-delete],
body.viewing [data-delete-deck],
body.viewing [data-rename],
body.viewing [data-archive],
body.viewing [data-action="add-match"],
body.viewing [data-action="add-deck"],
body.viewing [data-action="recommended-match"],
body.viewing [data-action="adopt-orphans"],
body.viewing [data-action="create-orphan-deck"],
body.viewing #demo-notice,
body.viewing .import-controls {
  display: none !important;
}

/* ---- deck recognition mark --------------------------------------------- */
.dmark { display: inline-block; width: 9px; height: 9px; border-radius: 3px;
  margin-right: 7px; vertical-align: 1px; background: var(--dot-l);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14); flex: 0 0 auto; }
h2 .dmark { width: 11px; height: 11px; border-radius: 4px; vertical-align: 2px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .dmark { background: var(--dot-d);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16); }
}
:root[data-theme="dark"] .dmark { background: var(--dot-d);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16); }

/* ---- branded dashboard header ------------------------------------------ */
.brand-hero { display: flex; align-items: center; gap: 22px; background: #000d30;
  border-radius: 18px; padding: 22px 26px; color: #eef1fb; }
.brand-hero img { width: 112px; height: 112px; border-radius: 14px; flex: 0 0 auto; }
.brand-hero .eyebrow { color: #8fa6e8; }
.brand-hero h1 { color: #fff; margin: 4px 0 6px; }
.brand-hero .intro { color: #c3cdeb; margin: 0; }
@media (max-width: 620px) {
  .brand-hero { flex-direction: column; align-items: flex-start; gap: 14px; padding: 18px; }
  .brand-hero img { width: 84px; height: 84px; }
}
.logger-link { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: calc(15 * var(--fs));
  word-break: break-all; }

/* ---- deck sprites (fetched once, then served locally) ------------------- */
/* The size comes from the markup, never from a load event: an image already in
   the browser's cache fires no load, and dialogs are built after the page has
   been wired, which left the 9px square holding two 22px sprites that spilled
   over the deck name. The class is on the element from the start; it is only
   taken off again if the image genuinely fails. */
.dmark.withicon,
:root[data-theme="dark"] .dmark.withicon {
  display: inline-flex; align-items: center; gap: 1px;
  width: auto; height: auto; min-width: 0;
  background: none; box-shadow: none; border-radius: 0;
  margin-right: 5px; vertical-align: -6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .dmark.withicon { background: none; box-shadow: none; }
}
.dicon { display: block; width: 22px; height: 22px; object-fit: contain;
  image-rendering: -webkit-optimize-contrast; flex: 0 0 auto; }
h2 .dmark.withicon { vertical-align: -7px; }

.icon-button.off { opacity: .45; }

/* ---- Consistency (trial) ------------------------------------------------ */
.cons-score {
  display: flex;
  align-items: baseline;
  gap: var(--gap);
  margin: 6px 0 14px;
}
.cons-score b { font-size: calc(38 * var(--fs)); line-height: 1; }
.cons-score span { color: var(--muted); font-size: calc(12 * var(--fs)); }
.cons-bar {
  display: grid;
  grid-template-columns: 1fr 4fr auto;
  align-items: center;
  gap: 10px;
  margin: 7px 0;
  font-size: calc(13 * var(--fs));
}
.cons-bar i {
  display: block;
  height: 8px;
  border-radius: 999px;
  background: var(--accent);
  min-width: 2px;
}
.cons-bar b { font-variant-numeric: tabular-nums; color: var(--muted); }
.cons-cards {
  display: grid;
  /* a name and three ticks need real room; too narrow and the last tick
     slides under the next column */
  /* min() so the 420px floor cannot be wider than the screen itself: on a
     phone it was pushing the whole page sideways. */
  grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
  gap: 2px 28px;
  margin-top: 10px;
}
.cons-card {
  display: grid;
  grid-template-columns: 2.6em minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
  font-size: calc(13 * var(--fs));
}
.cons-card .cons-ticks {
  display: flex;
  gap: 14px;
  justify-content: flex-end;
}
.cons-card.is-energy { opacity: 0.65; }
.cons-card .cons-n { color: var(--muted); text-align: right; }
.cons-card .cons-name { flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cons-card label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; }
.cons-tips { margin: 6px 0 0; padding-left: 22px; }
.cons-tips li { margin: 0 0 12px; }
.cons-tips li b { font-size: calc(14 * var(--fs)); }
.cons-tips li p { margin: 3px 0 0; color: var(--muted); font-size: calc(13 * var(--fs)); line-height: 1.6; }
.cons-head {
  border-left: 5px solid var(--line);
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  border-radius: 0 14px 14px 0;
  padding: 18px 22px;
  box-shadow: var(--shadow);
}
.cons-head.good { border-left-color: var(--good); }
.cons-head.warn { border-left-color: var(--warn); }
.cons-head.bad { border-left-color: var(--bad); }
.cons-headline { display: flex; align-items: center; gap: 16px; }
.cons-headline > b { font-size: calc(54 * var(--fs)); line-height: 1; font-variant-numeric: tabular-nums; }
.cons-head.good .cons-headline > b { color: var(--good); }
.cons-head.warn .cons-headline > b { color: var(--warn); }
.cons-head.bad .cons-headline > b { color: var(--bad); }
.cons-headline > div { display: flex; flex-direction: column; }
.cons-word { font-size: calc(19 * var(--fs)); font-weight: 700; }
.cons-sub { font-size: calc(11 * var(--fs)); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.cons-plain { font-size: calc(15 * var(--fs)); margin: 12px 0 2px; }
.cons-checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--gap); }
.cons-check {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 4px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: var(--shadow);
}
.cons-check.good { border-top-color: var(--good); }
.cons-check.warn { border-top-color: var(--warn); }
.cons-check.bad { border-top-color: var(--bad); }
.cons-check-label { display: block; font-size: calc(11 * var(--fs)); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.cons-check b { display: block; font-size: calc(22 * var(--fs)); margin: 3px 0 2px; }
.cons-check.good b { color: var(--good); }
.cons-check.warn b { color: var(--warn); }
.cons-check.bad b { color: var(--bad); }
.cons-check-note { font-size: calc(12 * var(--fs)); color: var(--muted); }
.cons-tips li.first > b { font-size: calc(16 * var(--fs)); }
.cons-tips li .badge { margin-left: 8px; vertical-align: 2px; }
.cons-maths summary { cursor: pointer; font-weight: 700; font-size: calc(14 * var(--fs)); }
.cons-maths[open] summary { margin-bottom: 12px; }
.cons-identify { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 14px 0 4px; }
.cons-identify .hint { flex: 1 1 320px; margin: 0; }
.cons-card label { white-space: nowrap; }
.cons-mine td { background: var(--accent2); font-weight: 600; }
/* The dot also appears inline in the settings list, where there is no flex
   row to give it a size of its own. */
.list-name .player-dot {
  display: inline-block;
  vertical-align: -1px;
  margin-right: 5px;
}
/* ---- the field table: numbers you can read at a glance ------------------ */
.cons-table td { vertical-align: middle; }
.cons-meter {
  display: inline-block;
  width: 86px;
  height: 8px;
  border-radius: 999px;
  background: var(--surface2);
  overflow: hidden;
  margin-right: 9px;
  vertical-align: 0;
}
.cons-meter i { display: block; height: 100%; border-radius: 999px; background: var(--muted); }
.cons-meter.good i { background: var(--good); }
.cons-meter.warn i { background: var(--warn); }
.cons-meter.bad i { background: var(--bad); }
.cons-num { font-variant-numeric: tabular-nums; font-weight: 700; }
.cons-num.good { color: var(--good); }
.cons-num.warn { color: var(--warn); }
.cons-num.bad { color: var(--bad); }
.cons-legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cons-key { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.cons-key::before { content: ""; width: 20px; height: 8px; border-radius: 999px; background: var(--muted); }
.cons-key.good::before { background: var(--good); }
.cons-key.warn::before { background: var(--warn); }
.cons-key.bad::before { background: var(--bad); }
.cons-key.good { color: var(--good); }
.cons-key.warn { color: var(--warn); }
.cons-key.bad { color: var(--bad); }

/* ---- text size, chosen in Appearance ----------------------------------- */
:root[data-text="compact"] { --fs-scale: 1; }      /* the size the app used to be */
:root[data-text="comfortable"] { --fs-scale: 1.15; }
:root[data-text="large"] { --fs-scale: 1.35; }
/* ---- the real-matchup matrix -------------------------------------------
   A square table of fifteen decks only reads if every cell is the same size,
   so the geometry is fixed here and nothing in the content may change it:
   both headers stack the icon over the name, names are clamped to two lines,
   and every row is the same height whatever the deck is called. */
.matrix-head-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.matrix-head-row .hint { flex: 1 1 320px; margin: 0; }
/* One row of controls, all the same height and all on the same line, the way
   the Cards page does it. A dropdown under its own label sat 25px lower than
   the buttons beside it, which is what made this corner look ragged. */
.matrix-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.matrix-controls .segmented { gap: 6px; }
/* the caption under the controls: says what the chosen order does */
.matrix-order-note { margin: 10px 0 14px; }
.matrix-controls .segmented button,
.matrix-controls .button {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  padding: 0 13px;
  font-size: calc(12 * var(--fs));
  white-space: nowrap;
}
.matrix-wrap { max-height: 72vh; overflow: auto; }
table.matrix {
  border-collapse: separate;
  border-spacing: 0;
  /* Fixed layout plus a full-width table is what makes the columns equal:
     with max-content the browser measures the text again and the longest
     deck name quietly widens its column. Below the minimum the wrapper
     scrolls rather than squeezing the numbers out of shape. */
  table-layout: fixed;
  width: 100%;
  min-width: 940px;
}
table.matrix th,
table.matrix td {
  /* the page-wide rule keeps table headings on one line; here a deck name
     has to be allowed to break, or half of it disappears */
  white-space: normal;
  width: 80px;
  height: 58px;
  padding: 4px 3px;
  text-align: center;
  vertical-align: middle;
  font-size: calc(10.5 * var(--fs));
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  overflow: hidden;
}
table.matrix thead th { height: 70px; position: sticky; top: 0; z-index: 2; background: var(--surface); }
/* A table cell treats height as a minimum, so the content is what has to be
   held in check: each header is a box of a fixed height that simply clips
   whatever does not fit, and every row ends up the same. */
table.matrix thead th .matrix-head { height: 58px; }
table.matrix tbody th .matrix-head { height: 66px; }
table.matrix tbody th,
table.matrix thead th:first-child {
  position: sticky;
  left: 0;
  z-index: 3;
  background: var(--surface);
  width: 120px;
}
table.matrix thead th:first-child { z-index: 4; }
/* the icon above the name, in both headers, and a name that never grows the
   cell: two lines at most, the rest cut with the full name in the tooltip */
.matrix-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  line-height: 1.12;
  font-weight: 600;
  overflow: hidden;
}
.matrix-head > span {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: break-word;
  text-align: center;
  width: 100%;
}
.matrix-head .dmark { flex: 0 0 auto; }
table.matrix td b { display: block; font-size: calc(12 * var(--fs)); }
table.matrix td small { color: var(--muted); font-size: calc(9.5 * var(--fs)); }
.matrix-thin { opacity: 0.55; }
.matrix-none { color: var(--muted); }
#dialog.wide { width: 96vw; max-width: 96vw; }
#dialog.wide .matrix-wrap { max-height: 80vh; }
.matrix-rank {
  display: block;
  font-size: calc(9.5 * var(--fs));
  color: var(--muted);
  font-weight: 700;
  white-space: nowrap;
}
.matrix-rank .shape { font-style: normal; font-weight: 600; }
.matrix-rank .shape.even { color: var(--good); }
.matrix-rank .shape.swingy { color: var(--warn); }
.matrix-rank.muted { font-weight: 400; }
.matrix-head .badge { font-size: calc(8.5 * var(--fs)); padding: 0 4px; }

/* ---- the tournament brief --------------------------------------------
   Two sheets of paper made out of what the app already holds. On screen it
   is a preview; on paper the application itself is hidden and only the
   sheet is left, so what is printed is exactly what was read. */
.brief-cta { display: flex; align-items: center; gap: 18px; justify-content: space-between; }
.brief-cta h2 { margin: 0 0 4px; }
.brief-cta .hint { margin: 0; max-width: 70ch; }

#brief-sheet { position: fixed; inset: 0; z-index: 60; overflow: auto; background: var(--surface2); }
.brief-bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brief-bar span { margin-right: auto; color: var(--muted); font-size: calc(12 * var(--fs)); }
.brief-paper { width: 210mm; max-width: 100%; margin: 18px auto 60px; background: #fff;
  color: #15151c; box-shadow: 0 2px 18px rgba(0, 0, 0, .16); }
.brief-page { padding: 14mm; font-size: 9.6pt; line-height: 1.45; }
.brief-page + .brief-page { border-top: 1px dashed #c9c9d4; }
.brief-page h1 { font-size: 18pt; margin: 0; letter-spacing: -.01em; }
.brief-page h2 { font-size: 12pt; margin: 7mm 0 2.5mm; }
.brief-page h2 small { font-weight: 400; color: #6a6a78; }
.brief-page h3 { font-size: 10pt; margin: 0 0 2mm; }
.brief-page h4 { font-size: 9pt; margin: 3mm 0 1mm; text-transform: uppercase;
  letter-spacing: .05em; color: #6a6a78; }
.brief-page h4 span { float: right; color: #15151c; }
.brief-head { display: flex; justify-content: space-between; align-items: flex-start;
  gap: 10mm; border-bottom: 1.6pt solid #15151c; padding-bottom: 3mm; }
.brief-sub { margin: 1.5mm 0 0; color: #5a5a68; }
.brief-event { display: flex; gap: 6mm; }
.brief-event span { display: block; min-width: 34mm; border-bottom: .6pt solid #9a9aa8;
  padding-bottom: 7mm; font-size: 7.5pt; color: #8a8a96; text-transform: uppercase;
  letter-spacing: .06em; }
.brief-figures { display: flex; gap: 4mm; margin: 4mm 0; }
.brief-figure { flex: 1; border: .6pt solid #d8d8e2; border-radius: 2mm; padding: 2.5mm 3mm; }
.brief-figure b { display: block; font-size: 15pt; line-height: 1.1; }
.brief-figure span { display: block; font-size: 8pt; color: #15151c; }
.brief-figure em { display: block; font-size: 7.5pt; color: #7a7a88; font-style: normal; }
.brief-two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 7mm; }
.brief-group ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 5mm; }
.brief-group li { font-size: 8.6pt; line-height: 1.5; break-inside: avoid; }
.brief-group li b { display: inline-block; min-width: 4mm; }
.brief-tips { margin: 0; padding-left: 4mm; }
.brief-tips li { margin-bottom: 1.8mm; }
.brief-table { width: 100%; border-collapse: collapse; font-size: 8.6pt; }
.brief-table th { text-align: left; border-bottom: .8pt solid #15151c; padding: 1.2mm 1mm;
  font-size: 7.6pt; text-transform: uppercase; letter-spacing: .04em; color: #5a5a68; }
.brief-table td { border-bottom: .4pt solid #e4e4ec; padding: 1.2mm 1mm; }
.brief-table th + th, .brief-table td + td { text-align: right; white-space: nowrap; }
.brief-points { margin: 3mm 0 0; padding-left: 4mm; font-size: 8.8pt; }
.brief-strip { display: flex; gap: 4mm; margin: 3mm 0 0; }
.brief-strip div { flex: 1; border-left: 1.6pt solid #15151c; padding-left: 2.5mm; }
.brief-strip b { display: block; font-size: 11pt; }
.brief-strip span { font-size: 7.8pt; color: #6a6a78; }
.brief-notes { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 7mm; }
.brief-notes li { break-inside: avoid; margin-bottom: 2.5mm; padding-left: 2.5mm;
  border-left: .8pt solid #c9c9d4; }
.brief-opp { font-weight: 700; font-size: 8.6pt; }
.brief-when { float: right; font-size: 7.5pt; color: #8a8a96; }
.brief-notes p { margin: .6mm 0 0; font-size: 8.4pt; line-height: 1.4; }
.brief-empty { color: #6a6a78; }
.brief-warn { margin: 4mm 0; padding: 2.5mm 3mm; border-left: 1.6pt solid #15151c;
  background: #f4f4f9; font-size: 8.8pt; }
.brief-write { margin-top: 6mm; }
.brief-write ol { margin: 0; padding: 0; list-style: none; counter-reset: round; }
.brief-write li { counter-increment: round; display: flex; gap: 3mm; align-items: baseline;
  border-bottom: .5pt solid #c9c9d4; padding: 3.4mm 0 1mm; }
.brief-write li::before { content: counter(round); font-size: 8pt; color: #8a8a96;
  min-width: 4mm; }
.brief-write li span:first-of-type { font-size: 8pt; color: #8a8a96; }
.brief-write li span:last-of-type { flex: 1; }
.brief-card { padding: 10mm; }
.brief-card h1 { font-size: 14pt; }
.brief-card .brief-figures { margin: 3mm 0 4mm; }
.brief-card .brief-figure b { font-size: 12pt; }

@media print {
  body > *:not(#brief-sheet) { display: none !important; }
  #brief-sheet { position: static; overflow: visible; background: #fff; }
  .brief-bar { display: none; }
  .brief-paper { width: auto; margin: 0; box-shadow: none; }
  .brief-page { padding: 0; background: #fff; }
  .brief-paper, body { background: #fff; }
  .brief-page + .brief-page { border-top: 0; break-before: page; }
}

/* ---- two versions of one list, side by side ---------------------------- */
/* the refusal to compare sits above everything and is not styled as a hint */
.cons-guard {
  border-left: 3px solid var(--bad);
  background: var(--bad-bg);
  border-radius: 0 10px 10px 0;
  padding: 13px 16px;
  margin-bottom: 12px;
  font-size: calc(13 * var(--fs));
}
.cons-why { margin: 0 0 4px; padding-left: 20px; }
.cons-why li { margin-bottom: 6px; font-size: calc(13 * var(--fs)); }
.cons-diff {
  display: grid;
  grid-template-columns: var(--cols-2);
  gap: var(--gap);
  margin-bottom: 6px;
}
.cons-diff ul { margin: 6px 0 0; padding: 0; list-style: none; }
.cons-diff li {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
  font-size: calc(13 * var(--fs));
}
.cons-diff li:last-child { border-bottom: 0; }
.cons-diff-n { font-weight: 700; min-width: 2.2em; }
/* the record half carries its warning where it cannot be scrolled past */
.cons-warn-note {
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: 10px;
  padding: 12px 14px;
}
.cons-like {
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin-top: 14px;
}
.cons-like h4 { margin: 0 0 4px; font-size: calc(14 * var(--fs)); }

/* a list that breaks a rule of the game, and the lines it is built on */
.cons-illegal { border-left: 3px solid var(--bad); }
.cons-illegal h3 { color: var(--bad); }
.cons-line { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--line); }
.cons-line:last-child { border-bottom: 0; }
.cons-line .hint { display: block; }

/* ---- preparing for a named event --------------------------------------- */
.plan-eyebrow {
  font-size: calc(10 * var(--fs));
  font-weight: 700;
  letter-spacing: 0.09em;
  color: var(--accent);
  margin-bottom: 2px;
}
.plan-capacity {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--gap);
  align-items: end;
  padding: 16px 0 4px;
}
/* `.total` is only dressed inside the dashboard strip, so the pair here
   carries its own shape rather than borrowing one that is not standalone. */
.plan-cov { display: flex; gap: 26px; }
.plan-cov .total { display: flex; flex-direction: column; gap: 2px; }
.plan-cov .total strong { font-size: calc(26 * var(--fs)); line-height: 1.1; }
.plan-cov .total span { font-size: calc(11 * var(--fs)); color: var(--muted); max-width: 11em; }
.plan-list { margin: 10px 0 0; padding: 0; list-style: none; }
.plan-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);

.plan-row:last-child { border-bottom: 0; }
.plan-row > div { flex: 1 1 320px; min-width: 0; }
.plan-row .hint { margin: 3px 0 0; }
.plan-n {
  flex: 0 0 46px;

  font-size: calc(19 * var(--fs));
  font-weight: 800;
  color: var(--accent);

   written as a hint among other hints */
.plan-lock {
  margin-top: 14px;

  border-radius: 10px;
  padding: 13px 16px;

.card.share-on {

  function reply(obj, status) {
    return new Response(JSON.stringify(obj), {
      status: status || 200, headers: { "Content-Type": "application/json" }
    });
  }
  function sameParams(a, b) {
    var ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
    if (ka.join() !== kb.join()) return false;
    return ka.every(function (k) { return String(a[k]) === String(b[k]); });
  }
  function reportFor(qs) {
    var want = {
      mode: qs.get("mode") || "online",
      days: Number(qs.get("days") || 14),
      end: qs.get("end") || "",
      minPlayers: Number(qs.get("minPlayers") || 50),
      minPair: Number(qs.get("minPair") || 10),
      cap: Number(qs.get("cap") || 20)
    };
    for (var k in SNAPSHOTS) {
      if (SNAPSHOTS[k] && SNAPSHOTS[k].params && sameParams(SNAPSHOTS[k].params, want)) return SNAPSHOTS[k];
    }
    /* The stored reports carry the end date they were built with, so from the
       day after this file was made nothing would match and the tab would sit
       empty. Fall back to the stored period for the same settings and say so,
       rather than showing nothing. */
    var loose = {};
    for (var key in want) if (key !== "end") loose[key] = want[key];
    for (var k2 in SNAPSHOTS) {
      var snap = SNAPSHOTS[k2];
      if (!snap || !snap.params) continue;
      var bare = {};
      for (var key2 in snap.params) if (key2 !== "end") bare[key2] = snap.params[key2];
      if (!sameParams(bare, loose)) continue;
      var copy = JSON.parse(JSON.stringify(snap));
      copy.source = (copy.source || "") + " — stored report, period ending " + snap.params.end;
      copy.storedSnapshot = true;
      return copy;
    }
    return null;
  }
  var NEEDS_SERVER = "This is the viewer edition, which has no local server. "
    + "Use the Windows or macOS edition for that.";
  var NOTHING_SAVED = "This is the viewer edition. It shows a database and changes nothing; "
    + "record rounds on the computer or in the phone logger.";

  /* Where a database comes from. Two ways in, and the strip says which one
     is in use: a file saved from the app, or the shared database read over
     https. Neither can write anything back. */
  /* Out of the way once it has done its job. The strip is a setup step, not
     part of the app: while there is no database it is the only thing worth
     looking at, and the moment one is loaded it is a band across the bottom
     of every page. So it folds into a small tab, which opens it again for a
     re-read, another repository or a different file. */
  function tuck(away) {
    var bar = document.getElementById("viewer-bar");
    var tab = document.getElementById("viewer-tab");
    if (!bar || !tab) return;
    bar.hidden = away;
    tab.hidden = !away;
    document.body.classList.toggle("viewer-tucked", away);
  }

  function show(state, what) {
    VIEWING = state;
    var line = document.getElementById("viewer-what");
    if (line) line.textContent = what;
    var tab = document.getElementById("viewer-tab-what");
    if (tab) tab.textContent = what;
    var back = document.getElementById("viewer-hide");
    if (back) back.hidden = false;
    if (typeof window.bootApp === "function") window.bootApp();
    tuck(true);
  }

  function viewerBar() {
    var wrap = document.createElement("div");
    wrap.id = "viewer-bar";
    wrap.innerHTML =
      '<div class="viewer-line"><label for="viewer-file"><b>Viewer.</b> <span id="viewer-what">' +
      (VIEWING ? "Showing the database saved into this file."
               : "Nothing is loaded yet — read the shared database, or open a JSON backup.") +
      '</span></label>' +
      '<button type="button" id="viewer-gh">Read the shared database…</button>' +
      '<button type="button" id="viewer-hide" hidden title="Put this away">Done</button>' +
      '<input id="viewer-file" type="file" accept="application/json,.json">' +
      '<span id="viewer-msg"></span></div>' +
      '<form id="viewer-panel" hidden>' +
      '<p class="viewer-note">The same private repository the app syncs with, read over the ' +
      'internet. This page only ever reads it — there is no code here that could write.</p>' +
      '<div class="viewer-fields">' +
      '<label>Repository<input id="gh-repo" placeholder="your-account/matchup-lab-data" ' +
      'autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
      '<label>Branch<input id="gh-branch" value="main" autocomplete="off" ' +
      'autocapitalize="off" spellcheck="false"></label>' +
      '<label>File<input id="gh-path" value="data.json" autocomplete="off" ' +
      'autocapitalize="off" spellcheck="false"></label>' +
      '<label>Token · Contents: read<input id="gh-token" type="password" ' +
      'autocomplete="off" placeholder="github_pat_…"></label>' +
      "</div>" +
      '<label class="viewer-check"><input type="checkbox" id="gh-keep"> Keep a copy on this ' +
      "device, so this works without a signal</label>" +
      '<p class="viewer-note" id="viewer-where"></p>' +
      '<div class="viewer-actions"><button type="submit" id="gh-read">Read it now</button>' +
      '<button type="button" id="gh-forget">Forget this device’s settings</button></div>' +
      "</form>";
    document.body.appendChild(wrap);

    var tab = document.createElement("button");
    tab.id = "viewer-tab";
    tab.type = "button";
    tab.hidden = true;
    tab.innerHTML = '<span class="viewer-dot"></span><b>Viewer</b>'
      + '<span id="viewer-tab-what"></span>';
    tab.title = "Where this database came from";
    tab.addEventListener("click", function () { tuck(false); });
    document.body.appendChild(tab);

    var msg = wrap.querySelector("#viewer-msg");
    var panel = wrap.querySelector("#viewer-panel");
    var where = wrap.querySelector("#viewer-where");
    var field = function (id) { return wrap.querySelector("#" + id); };

    var c = ghConfig();
    field("gh-repo").value = c.repo || "";
    field("gh-branch").value = c.branch || "main";
    field("gh-path").value = c.path || "data.json";
    field("gh-keep").checked = !!c.keep;
    where.textContent = stored
      ? "The token is kept in this browser on this device. Nowhere else, and never sent anywhere "
        + "but GitHub. Use one limited to this repository, and revoke it there if the device is lost."
      : "This browser will not keep anything for a page opened from a file, so the token lasts "
        + "until the tab is closed. Opening the page from an https address fixes that.";

    wrap.querySelector("#viewer-gh").addEventListener("click", function () {
      panel.hidden = !panel.hidden;
    });
    /* Only offered once there is something to go back to. */
    var hide = wrap.querySelector("#viewer-hide");
    hide.addEventListener("click", function () { panel.hidden = true; tuck(true); });

    /* Opening a backup instead. A file picker rather than anything stored, so
       the only copy on this device is the file the person already has. */
    var input = wrap.querySelector("#viewer-file");
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      msg.textContent = "Reading…";
      var r = new FileReader();
      r.onerror = function () { msg.textContent = "That file could not be read."; };
      r.onload = function () {
        var data;
        try { data = JSON.parse(String(r.result)); }
        catch (e) { msg.textContent = "That is not a JSON backup."; return; }
        /* A backup, or the whole file the app syncs - both carry the same
           shape, and either is worth showing. */
        var state = data && data.state && data.state.config ? data.state : data;
        if (!state || !state.config || !Array.isArray(state.config.decks)) {
          msg.textContent = "No decks in that file — is it a Matchup Lab backup?";
          return;
        }
        msg.textContent = "";
        show(state, f.name + " — " + (state.matches || []).length + " rounds. Nothing here is saved.");
      };
      r.readAsText(f);
    });

    function pull(cfg, quiet) {
      if (!quiet) msg.textContent = "Reading the shared database…";
      return ghRead(cfg).then(function (state) {
        msg.textContent = "";
        panel.hidden = true;
        if (cfg.keep) writeStore(GH_COPY, { at: Date.now(), state: state });
        show(state, (state.matches || []).length + " rounds, read just now from "
          + cfg.repo + ". Nothing here is saved" + (cfg.keep ? " but the copy you asked for." : "."));
      }).catch(function (e) {
        msg.textContent = e.message || String(e);
        /* A copy kept on purpose is what this moment is for. */
        var held = cfg.keep ? readStore(GH_COPY) : null;
        if (held && held.state) {
          show(held.state, (held.state.matches || []).length + " rounds, kept on this device on "
            + new Date(held.at).toLocaleString() + ". Could not reach GitHub just now.");
        } else if (VIEWING) {
          /* Something is already on screen. Say so on the tab rather than
             covering what the person came to look at. */
          var tabWhat = document.getElementById("viewer-tab-what");
          if (tabWhat) tabWhat.textContent = "could not reach GitHub just now";
        } else {
          /* Nothing to show and nothing came back: the only useful thing
             left on this page is the message and the way to fix it. */
          tuck(false);
          panel.hidden = false;
        }
      });
    }

    panel.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var token = field("gh-token").value.replace(/\s+/g, "").replace(/^["']|["']$/g, "");
      var next = {
        repo: field("gh-repo").value.trim().replace(/^\/+|\/+$/g, ""),
        branch: field("gh-branch").value.trim() || "main",
        path: field("gh-path").value.trim() || "data.json",
        keep: field("gh-keep").checked,
        token: token || ghConfig().token || ""
      };
      if (next.repo.indexOf("/") < 1) {
        msg.textContent = "The repository goes in as owner/name.";
        return;
      }
      if (!next.token) {
        msg.textContent = "The token field is empty — the paste did not land.";
        return;
      }
      if (next.token.length < 20) {
        msg.textContent = "That token looks cut short (" + next.token.length
          + " characters). GitHub tokens are about 40 or 90.";
        return;
      }
      setGhConfig(next);
      field("gh-token").value = "";
      if (!next.keep) dropStore(GH_COPY);
      pull(next, false);
    });

    wrap.querySelector("#gh-forget").addEventListener("click", function () {
      memory.cfg = null;
      dropStore(GH_CFG);
      dropStore(GH_COPY);
      field("gh-repo").value = ""; field("gh-token").value = "";
      field("gh-branch").value = "main"; field("gh-path").value = "data.json";
      field("gh-keep").checked = false;
      msg.textContent = "Repository, token and any kept copy removed from this device. "
        + "Revoke the token on GitHub as well if the device may be out of your hands.";
    });

    /* A database baked into the file is there before any of this runs, so
       the strip starts folded rather than appearing and then vanishing. */
    if (VIEWING) {
      var first = document.getElementById("viewer-what");
      var tabWhat = document.getElementById("viewer-tab-what");
      if (first && tabWhat) tabWhat.textContent = first.textContent;
      wrap.querySelector("#viewer-hide").hidden = false;
      tuck(true);
    }

    /* Opened again with everything already filled in: read it, quietly, and
       folded from the start - the strip appearing for a second and then
       vanishing on every open is worse than never seeing it. */
    if (c.repo && c.token) {
      var tabWhat2 = document.getElementById("viewer-tab-what");
      if (tabWhat2) tabWhat2.textContent = "reading " + c.repo + "…";
      wrap.querySelector("#viewer-hide").hidden = false;
      tuck(true);
      pull(c, true);
    }
    else if (c.keep) {
      var held = readStore(GH_COPY);
      if (held && held.state)
        show(held.state, (held.state.matches || []).length + " rounds, kept on this device on "
          + new Date(held.at).toLocaleString() + ".");
    }
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", viewerBar);
  else viewerBar();
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/") !== 0) return native ? native(input, init) : Promise.reject(Error("offline"));
    var parts = url.split("?"), path = parts[0];
    var qs = new URLSearchParams(parts[1] || "");
    var method = (init && init.method) || "GET";
    var body = null;
    try { body = init && init.body ? JSON.parse(init.body) : null; } catch (e) { body = null; }
    try {
      if (path === "/api/ping") return Promise.resolve(reply({ app: "matchup-lab", build: BUILD, appDir: "(bundled)" }));
      if (path === "/api/state" && method === "GET")
        return Promise.resolve(reply({ state: load(), csrf: "local", sync: SYNC_OFF, build: BUILD,
          /* The app already knows how to be read-only: it keeps a change in
             memory, hides every editing control and says so in the top bar.
             Saying so here turns the whole edition into that. */
          players: { enabled: false, readOnly: true, viewer: true, revealed: false, count: 1,
                     activeName: "", first: "", hasList: true, trial: false } }));
      if (path === "/api/state" && method === "POST")
        return Promise.resolve(reply({ error: NOTHING_SAVED }, 501));
      if (path === "/api/sync") return Promise.resolve(reply(SYNC_OFF));
      if (path === "/api/trends/job") return Promise.resolve(reply({ job: null }));
      if (path === "/api/trends/report") return Promise.resolve(reply({ report: reportFor(qs) }));
      /* The matrix on the Matchups page asks for "the newest report there is",
         which here means the newest snapshot built into this file. Nothing is
         fetched, so the matrix is as current as the file itself. */
      if (path === "/api/trends/latest") {
        var want = qs.get("mode"), best = null;
        for (var sk in SNAPSHOTS) {
          var snap = SNAPSHOTS[sk];
          if (!snap || !snap.analysis) continue;
          if (want && (snap.params || {}).mode !== want) continue;
          if (!best || (snap.fetchedAt || 0) > (best.fetchedAt || 0)) best = snap;
        }
        return Promise.resolve(reply({ report: best }));
      }
      if (path === "/api/backups") return Promise.resolve(reply({ backups: [] }));
      if (path === "/api/trends/refresh" || path === "/api/limitless" || path === "/api/ciphermaniac"
          || path === "/api/sync/config" || path === "/api/sync/disconnect"
          || path === "/api/backup" || path === "/api/open-folder" || path === "/api/shutdown"
          || path === "/api/cardtypes" || path === "/api/field"
          || path.indexOf("/api/players/") === 0)
        return Promise.resolve(reply({ error: NEEDS_SERVER }, 501));
      return Promise.resolve(reply({ error: "Not found." }, 404));
    } catch (e) {
      return Promise.resolve(reply({ error: e.message || String(e) }, 500));
    }
  };
})();

function playersCard() {

      ` Open now: <b>${esc(me ? me.name : "—")}</b>${viewingOnly() ? " (viewing only)" : ""}.</p>` +
      list
        .map(
          (x) =>
            `<div class="list-row"><div><div class="list-name"><span class="player-dot" style="--player:${esc(
              x.colour || "",
            )}"></span> ${esc(x.name)}${x.protected ? ' <span class="badge purple">FIRST</span>' : ""}</div>` +
            `<div class="list-meta">${x.mode === "views" ? "viewing only on this computer" : "records here"}</div></div>` +
            (x.active ? '<span class="badge good">OPEN</span>' : "") +
            `</div>`,
        )
        .join("") +
      `<div class="actions" style="margin-top:14px"><button class="button primary" data-action="player-switch">Manage players…</button>` +
      `<button class="button" data-action="player-hide">Hide other players</button></div>` +
      `<p class="hint">Hiding puts ${esc(p.list && p.list[0] ? p.list[0].name : "the first database")} back on screen and leaves every other one exactly where it is.</p></div>`
    );
  }
  const readSwitch = viewingOnly()
    ? `<button class="button" data-action="player-record">Record on this computer again</button>`
    : `<button class="button" data-action="player-readonly">Only read on this computer</button>`;
  const readNote = viewingOnly()
    ? `<p class="hint"><b>This computer is reading only.</b> The database is shown as it arrives and nothing is written back — not a round, not a correction, not a card marking.</p>`
    : `<p class="hint">If you only want to look at this database here — say it is someone else's and they record on their own machine — set this computer to reading only. It is a setting of this computer alone and is never sent anywhere.</p>`;
  if (p.hasList) {
    return (
      `<div class="card"><h2>Players</h2><p class="hint">This computer holds ${plural(p.count || 1, "database")}, ` +
      `but only <b>${esc(p.first || "the first")}</b> is shown. Nothing else has been removed.</p>` +

    );

    `<div class="card"><h2>Players</h2><p class="hint">The app keeps one database. If someone else uses this computer, ` +
    `they can have one of their own — separate matches, decks and backups — and you choose which is open.</p>` +
    `<p class="hint">Nothing is moved or copied: the database already here becomes the first player, and it can never be deleted from the list.</p>` +
    readNote +
    `<div class="actions"><button class="button primary" data-action="player-reveal">Set up players…</button>${readSwitch}</div></div>`
  );
}
function playerDialog() {

      (p) =>
        `<div class="player-row"><span class="player-dot" style="--player:${esc(
          p.colour || "",
        )}"></span><div style="flex-grow:1;min-width:0"><div class="list-name">${esc(p.name)}${
          p.active ? ' <span class="badge good">OPEN</span>' : ""
        }${
          p.mode === "views"
            ? ' <span class="badge">VIEWING ONLY</span>'
            : ' <span class="badge purple">RECORDS HERE</span>'
        }</div><div class="list-meta">${esc(p.dir)}</div></div>${
          p.active
            ? ""
            : `<button class="button small" data-switch-player="${esc(p.id)}">Open</button>`

          p.mode === "views" ? "Records here" : "Viewing only"
        }</button></div>`,
    )
    .join("");

    "Whose database",
    `<p class="hint">Each player has a database of their own — matches, decks and backups. The app opens one at a time, so nothing can be recorded against the wrong person.</p>${rows}` +
      `<p class="hint" style="margin-top:14px"><b>Records here / viewing only</b> is a setting of this computer. It is never sent anywhere, so each of your computers decides for itself.</p>` +
      `<div class="form-end"><button class="button" data-action="player-add">+ Add player…</button><button class="button primary" data-action="close">Done</button></div>`,
  );
}
async function playerCall(path, body, note) {
  try {
    const j = await api("/api/players/" + path, body);
    playersInfo = j.players || playersInfo;
    if (note) toast(note);
    return j;
  } catch (e) {
    toast(e.message);
    return null;
  }
}
async function reopenAfterSwitch() {
  const j = await api("/api/state");
  csrf = j.csrf;
  state = migrate(j.state);
  syncInfo = j.sync || {};
  rememberLauncher(syncInfo.launcher);
  playersInfo = j.players || playersInfo;
  pending = false;
  draftBase = null;
  persist();
  closeDialog();
  showPlayer();
  render();
}

}
